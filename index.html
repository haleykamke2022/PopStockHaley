<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#607760"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cake Pop Inventory"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><title>Cake Pop Inventory</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#273b30;font:15px system-ui,-apple-system,sans-serif}header{background:#607760;color:white;padding:14px 18px;display:flex;gap:12px;align-items:center}header img{width:52px;height:52px;object-fit:contain;border-radius:12px;background:white}h1{font-size:19px;margin:0}h2{font-size:21px;margin:10px 0 16px}h3{margin:8px 0}small,.muted{color:#728175}header small{color:#edf4e8}nav{display:flex;overflow-x:auto;background:#fff;position:sticky;top:0;z-index:3;border-bottom:1px solid #dde6dc}nav button{background:transparent;color:#536f56;white-space:nowrap;flex:1;padding:13px 10px;border-radius:0}nav button.sel{background:#e1ebe0;color:#23442d}button{cursor:pointer;background:#607760;border:0;border-radius:11px;padding:10px 13px;color:white;font:600 14px system-ui}button.alt{background:#e4ece3;color:#35543a}button.danger{background:#f9e2df;color:#8d352b}main{max-width:850px;margin:auto;padding:18px 14px 100px}section{display:none}section.show{display:block}.card{background:white;border:1px solid #e2e8dd;border-radius:17px;padding:15px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{text-align:left;background:white;border:1px solid #dce5d9;border-radius:16px;color:#2f4934;min-height:120px;padding:15px;display:flex;flex-direction:column;justify-content:center;gap:7px}.tile .emoji{font-size:29px}.item{padding:12px 0;border-bottom:1px solid #edf1eb}.item:last-child{border:0}.small{font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button{padding:8px 11px}.notice{padding:12px;background:#eaf1e7;border-radius:12px;font-size:13px;margin:10px 0}.warning{background:#fff0d9}.bad{color:#b23d2e}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;font:inherit;border:1px solid #ccd8ca;border-radius:10px;background:white;color:#293d30}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}.pair{border:1px solid #dfe9dc;border-radius:12px;padding:10px;margin:8px 0}dialog{border:0;border-radius:18px;width:min(96vw,540px);max-height:87vh;overflow:auto;padding:18px;box-shadow:0 15px 70px #26362d77}dialog::backdrop{background:#16291a88}.pill{font-size:12px;padding:5px 8px;border-radius:30px;background:#e7efe4}footer{text-align:center;font-size:12px;color:#7d8b7d;margin:25px 0}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}} </style></head><body><header><img id="brandImage" src="./icons/icon-192.png" alt="App logo"><div><h1>Cake Pop Inventory</h1><small>My kitchen planner</small></div></header><nav id="nav"></nav><main><section id="stock"></section><section id="flavors"></section><section id="orders"></section><section id="events"></section><section id="shopping"></section><section id="settings"></section><footer>Personal-use app • Saved on this device • Export backups often</footer></main><dialog id="dialog"><div class="row"><h2 id="dialogTitle"></h2><button class="alt" onclick="document.getElementById('dialog').close()">✕</button></div><div id="dialogBody"></div></dialog><script>
const KEY='cakepop_simple_v1',NEW='cakepop_custom_v2';const defaults=['Emulsions','Inclusions','Sprinkles','Almond bark','Cake mixes','Shapes','Packaging'];const icons=['🧴','🍪','🌈','🍫','🎂','💗','🎁'];const oldNames={'Popper shapes':'Shapes','Popsicle sticks':'Packaging','Wraps':'Packaging','Stickers':'Packaging','Boxes':'Packaging','Decorations':'Packaging','Other':'Packaging'};const seed=()=>({items:[],recipes:[],orders:[],events:[],categories:defaults.map((name,j)=>({id:'c'+j,name,emoji:icons[j]})),logo:'',log:[]});let d;try{d=JSON.parse(localStorage.getItem(NEW))}catch{}if(!d){let old;try{old=JSON.parse(localStorage.getItem(KEY))}catch{}d=seed();if(old&&Array.isArray(old.items)){d.items=old.items.map(i=>({...i,type:oldNames[i.type]||i.type,restock:i.restock??Math.max(1,i.min||1)}));d.recipes=old.recipes||[];d.orders=(old.orders||[]).map(o=>({...o,lines:o.lines||[],status:o.status||'Planned',deducted:o.deducted||false}));d.log=old.log||[]}}d.categories ||=seed().categories;d.events ||= [];d.orders ||= [];d.recipes ||= [];d.items ||= [];d.log ||= [];d.logo ||= '';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),catName=i=>d.categories.find(c=>c.id===i.type)?.name||i.type||'Uncategorized',catOf=i=>d.categories.find(c=>c.id===i.type)||d.categories.find(c=>c.name===i.type),itemName=x=>d.items.find(i=>i.id===x)?.name||'Deleted supply',flavorName=x=>d.recipes.find(r=>r.id===x)?.name||'Deleted flavor';let tab='stock',selected=null;function save(){try{localStorage.setItem(NEW,JSON.stringify(d))}catch(e){alert('Phone storage is full. Export a backup; consider using a smaller logo.')}}function modal(title,body){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialog').showModal()}function done(){save();$('dialog').close();render()}function go(t){tab=t;selected=null;render()}function render(){$('nav').innerHTML=[['stock','📦 Stock'],['flavors','🧁 Flavors'],['orders','📋 Orders'],['events','🎪 Events'],['shopping','🛒 Shopping'],['settings','⚙️ Settings']].map(([t,l])=>`<button class="${tab===t?'sel':''}" onclick="go('${t}')">${l}</button>`).join('');document.querySelectorAll('section').forEach(s=>s.classList.toggle('show',s.id===tab));$('brandImage').src=d.logo||'./icons/icon-192.png';renderStock();renderFlavors();renderPlans('orders');renderPlans('events');renderShopping();renderSettings()}
function renderStock(){let cats=d.categories;let html=selected?`<div class="row"><button class="alt" onclick="selected=null;render()">← Categories</button><button onclick="editItem('', '${selected}')">+ Supply</button></div><h2>${esc(cats.find(c=>c.id===selected)?.emoji||'📦')} ${esc(cats.find(c=>c.id===selected)?.name||'Stock')}</h2>`:`<div class="row"><h2>My Stock</h2><button onclick="editItem()">+ Supply</button></div><p class="muted">Choose a category to view and update your supplies.</p><div class="grid">${cats.map(c=>`<button class="tile" onclick="selected='${c.id}';render()"><span class="emoji">${esc(c.emoji)}</span><strong>${esc(c.name)}</strong><small>${d.items.filter(i=>catOf(i)?.id===c.id).length} supplies →</small></button>`).join('')}</div>`;if(selected){let list=d.items.filter(i=>catOf(i)?.id===selected);html+=`<div class="card">${list.length?list.map(i=>`<div class="item"><div class="row"><strong>${esc(i.name)}</strong><span class="pill">${Number(i.qty)} ${esc(i.unit||'packs')}</span></div><div class="small muted">Low at ${i.min||0} · Restock target ${i.restock??i.min??0} ${esc(i.unit||'packs')}</div><div class="actions"><button class="alt" onclick="adjust('${i.id}',1)">+ Add</button><button class="alt" onclick="adjust('${i.id}',-1)">− Use</button><button class="alt" onclick="editItem('${i.id}')">Edit</button></div></div>`).join(''):'<p class="muted">No supplies here yet.</p>'}</div>`} $('stock').innerHTML=html}
function editItem(x='',cat=''){let i=d.items.find(i=>i.id===x)||{name:'',type:cat||d.categories[0]?.id,qty:0,min:1,restock:3,unit:'pack'};modal(x?'Edit stock':'Add stock',`<form onsubmit="saveItem(event,'${x}')"><label>Supply name</label><input name="name" required value="${esc(i.name)}"><label>Category</label><select name="type">${d.categories.map(c=>`<option value="${c.id}" ${catOf(i)?.id===c.id?'selected':''}>${esc(c.emoji)} ${esc(c.name)}</option>`).join('')}</select><div class="formgrid"><div><label>Quantity in stock</label><input name="qty" type="number" step="1" min="0" value="${i.qty}" required></div><div><label>Unit</label><input name="unit" value="${esc(i.unit||'pack')}"></div><div><label>Low stock alert at</label><input name="min" type="number" min="0" step="1" value="${i.min||0}"></div><div><label>Restock target</label><input name="restock" type="number" min="0" step="1" value="${i.restock??i.min??0}"></div></div><div class="actions"><button>Save supply</button>${x?`<button type="button" class="danger" onclick="removeItem('${x}')">Delete</button>`:''}</div></form>`)}function saveItem(e,x){e.preventDefault();let f=e.target,z={id:x||id(),name:f.elements.name.value.trim(),type:f.elements.type.value,qty:+f.elements.qty.value,unit:f.elements.unit.value||'pack',min:+f.elements.min.value,restock:+f.elements.restock.value};let old=d.items.find(i=>i.id===x);if(old)Object.assign(old,z);else d.items.push(z);done()}function removeItem(x){if(!confirm('Delete this supply? Existing flavors may reference it.'))return;d.items=d.items.filter(i=>i.id!==x);done()}function adjust(x,sign){let i=d.items.find(i=>i.id===x),v=prompt(`${sign>0?'Add':'Use'} how many ${i.unit||'packs'} of ${i.name}?`,'1');if(v===null)return;let n=Number(v);if(!Number.isInteger(n)||n<=0||sign<0&&i.qty<n){alert('Enter a valid whole number within available stock.');return}i.qty+=sign*n;save();render()}
function renderFlavors(){$('flavors').innerHTML=`<div class="row"><h2>My Flavors</h2><button onclick="editFlavor()">+ Flavor</button></div><div class="notice">Save each flavor with the ingredients and packaging used for one batch. Assign flavors to orders or events to plan stock.</div>${d.recipes.map(r=>`<div class="card"><div class="row"><div><strong>${esc(r.name)}</strong><div class="muted small">Makes ${r.yield||1} cake pops per batch</div></div><button class="alt" onclick="editFlavor('${r.id}')">Edit</button></div><div class="small" style="margin-top:10px">${(r.parts||[]).map(p=>`${esc(itemName(p.id))}: ${p.qty}`).join(' · ')||'No ingredients yet'}</div></div>`).join('')||'<div class="card muted">Add your first flavor to begin.</div>'}`}
function partRow(p={}){let box=document.createElement('div');box.className='pair ingredient';box.innerHTML=`<label>Supply</label><select class="ingredient-id">${d.items.map(i=>`<option value="${i.id}" ${p.id===i.id?'selected':''}>${esc(i.name)} (${esc(i.unit||'pack')})</option>`).join('')}</select><label>Whole packages per batch</label><input class="ingredient-qty" type="number" min="1" step="1" value="${p.qty||1}"><button type="button" class="alt" style="margin-top:7px" onclick="this.parentElement.remove()">Remove</button>`;$('ingredients').append(box)}function editFlavor(x=''){let r=d.recipes.find(r=>r.id===x)||{name:'',yield:24,parts:[]};modal(x?'Edit flavor':'New flavor',`<form onsubmit="saveFlavor(event,'${x}')"><label>Flavor name</label><input name="name" value="${esc(r.name)}" required><label>Number of pops made per batch</label><input name="yield" type="number" min="1" step="1" value="${r.yield||24}" required><h3>Ingredients and packaging</h3><div class="notice">Enter the number of whole packs/boxes/bottles used per batch. Partial packages aren't tracked in Simple mode.</div><div id="ingredients"></div><button type="button" class="alt" onclick="partRow()">+ Add supply</button><div class="actions"><button>Save flavor</button>${x?`<button type="button" class="danger" onclick="removeFlavor('${x}')">Delete</button>`:''}</div></form>`);(r.parts||[]).forEach(partRow)}function saveFlavor(e,x){e.preventDefault();let f=e.target,parts=[...document.querySelectorAll('.ingredient')].map(b=>({id:b.querySelector('select').value,qty:+b.querySelector('input').value}));if(parts.some(p=>!p.id||!Number.isInteger(p.qty)||p.qty<=0)){alert('Check ingredient amounts.');return}let r={id:x||id(),name:f.elements.name.value.trim(),yield:+f.elements.yield.value,parts};let old=d.recipes.find(r=>r.id===x);if(old)Object.assign(old,r);else d.recipes.push(r);done()}function removeFlavor(x){if(!confirm('Delete flavor?'))return;d.recipes=d.recipes.filter(r=>r.id!==x);done()}
function quantities(lines){let q={};for(let l of lines||[]){let r=d.recipes.find(r=>r.id===l.flavor);if(!r)continue;let mult=Math.ceil(Number(l.count||0)/Number(r.yield||1));for(let p of r.parts||[])q[p.id]=(q[p.id]||0)+p.qty*mult}return q}function stockShort(q){return Object.entries(q).filter(([x,n])=>(d.items.find(i=>i.id===x)?.qty||0)<n)}function planLinesHTML(lines){return (lines||[]).map(l=>`<div class="small">${esc(flavorName(l.flavor))} — ${l.count} pops</div>`).join('')||'<span class="muted">No flavors selected</span>'}function renderPlans(kind){let isEvent=kind==='events',list=d[kind];$(kind).innerHTML=`<div class="row"><h2>${isEvent?'Events':'Orders'}</h2><button onclick="editPlan('${kind}')">+ ${isEvent?'Event':'Order'}</button></div><div class="notice">${isEvent?'Plan flavors and create a shopping list for each event.':'When you change an order to In progress, its planned ingredients are deducted once. You can also mark an event In progress when you pull its supplies.'}</div>${list.map(p=>`<div class="card"><div class="row"><div><strong>${esc(p.name||p.customer||'Untitled')}</strong><div class="small muted">${esc(p.date||p.due||'No date')} · ${esc(p.status||'Planned')}</div></div><button class="alt" onclick="editPlan('${kind}','${p.id}')">Edit</button></div><div style="margin:10px 0">${planLinesHTML(p.lines)}</div><div class="actions">${p.status!=='In progress'&&p.status!=='Completed'?`<button onclick="progress('${kind}','${p.id}')">Start / pull stock</button>`:''}${isEvent?`<button class="alt" onclick="shoppingEvent='${p.id}';go('shopping')">Event shopping list</button>`:''}${p.status==='In progress'?`<button class="alt" onclick="complete('${kind}','${p.id}')">Mark completed</button>`:''}</div></div>`).join('')||'<div class="card muted">Nothing planned yet.</div>'}`}
function addLine(l={}){let el=document.createElement('div');el.className='pair planline';el.innerHTML=`<label>Flavor</label><select class="flavor">${d.recipes.map(r=>`<option value="${r.id}" ${l.flavor===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select><label>Number of cake pops</label><input class="count" type="number" min="1" step="1" value="${l.count||24}"><button type="button" class="alt" style="margin-top:8px" onclick="this.parentElement.remove()">Remove</button>`;$('planlines').append(el)}function editPlan(kind,x=''){let isEvent=kind==='events',p=d[kind].find(p=>p.id===x)||{name:'',date:'',status:'Planned',lines:[]};if(p.status==='In progress'||p.status==='Completed'){alert('This plan has already started or completed. To protect stock counts, its flavors and quantities cannot be edited.');return}modal(x?'Edit '+(isEvent?'event':'order'):'New '+(isEvent?'event':'order'),`<form onsubmit="savePlan(event,'${kind}','${x}')"><label>${isEvent?'Event name':'Customer / order name'}</label><input name="name" value="${esc(p.name||p.customer||'')}" required><label>${isEvent?'Event date':'Due date'}</label><input type="date" name="date" value="${esc(p.date||p.due||'')}"><h3>Planned flavors</h3><div id="planlines"></div><button type="button" class="alt" onclick="addLine()">+ Add flavor</button><div class="actions"><button>Save ${isEvent?'event':'order'}</button>${x?`<button type="button" class="danger" onclick="deletePlan('${kind}','${x}')">Delete</button>`:''}</div></form>`);(p.lines||[]).forEach(addLine)}function savePlan(e,kind,x){e.preventDefault();let f=e.target,lines=[...document.querySelectorAll('.planline')].map(el=>({flavor:el.querySelector('select').value,count:+el.querySelector('input').value}));if(lines.some(l=>!l.flavor||!Number.isInteger(l.count)||l.count<=0)){alert('Choose a flavor and a valid number of pops.');return}let p={id:x||id(),name:f.elements.name.value.trim(),date:f.elements.date.value,status:'Planned',lines,deducted:false};let old=d[kind].find(p=>p.id===x);if(old)Object.assign(old,p);else d[kind].push(p);done()}function deletePlan(kind,x){if(!confirm('Delete this plan?'))return;d[kind]=d[kind].filter(p=>p.id!==x);done()}function progress(kind,x){let p=d[kind].find(p=>p.id===x);if(!p||p.status!=='Planned')return;if(!p.lines?.length){alert('Add planned flavors first.');return}let q=quantities(p.lines),missing=stockShort(q);if(missing.length){alert('Not enough stock to start. Add these supplies first:\n'+missing.map(([id,n])=>`${itemName(id)}: need ${n}, have ${d.items.find(i=>i.id===id)?.qty||0}`).join('\n'));return}if(!confirm('Mark In progress and deduct the planned supplies from stock now?'))return;for(let [x,n] of Object.entries(q))d.items.find(i=>i.id===x).qty-=n;p.status='In progress';p.deducted=true;p.used=q;d.log.push({type:'Plan started',kind,id:x,date:new Date().toISOString(),used:q});save();render()}function complete(kind,x){let p=d[kind].find(p=>p.id===x);if(p?.status==='In progress'){p.status='Completed';save();render()}}
let shoppingEvent='';function renderShopping(){let options=d.events.map(e=>`<option value="${e.id}" ${shoppingEvent===e.id?'selected':''}>${esc(e.name)}</option>`).join('');let ev=d.events.find(e=>e.id===shoppingEvent),needs=ev?quantities(ev.lines):{},rows=ev?Object.entries(needs).map(([x,required])=>{let i=d.items.find(i=>i.id===x),have=i?.qty||0;return {name:itemName(x),have,required,buy:Math.max(0,required-have),unit:i?.unit||'pack'}}):d.items.filter(i=>i.qty<=i.min).map(i=>({name:i.name,have:i.qty,required:i.restock??i.min,buy:Math.max(0,(i.restock??i.min)-i.qty),unit:i.unit||'pack'}));$('shopping').innerHTML=`<h2>Shopping Lists</h2><div class="card"><label>View list</label><select onchange="shoppingEvent=this.value;renderShopping()"><option value="">General restock list</option>${options}</select><p class="muted small">${ev?'Shows stock on hand and supplies needed for this event. This does not deduct stock.':'Low-stock items with suggested quantities based on each item’s separate restock target.'}</p></div><div class="card">${rows.length?rows.map(r=>`<div class="item"><div class="row"><strong>${esc(r.name)}</strong>${r.buy>0?`<span class="pill">Buy ${r.buy}</span>`:'<span class="pill">In stock</span>'}</div><div class="small muted">In stock: ${r.have} ${esc(r.unit)} · ${ev?'Event needs':'Target'}: ${r.required} ${esc(r.unit)}</div></div>`).join(''):'<p class="muted">Nothing needed on this list.</p>'}</div><button onclick="copyShop()">Copy this list</button>`}function copyShop(){let ev=d.events.find(e=>e.id===shoppingEvent),q=ev?quantities(ev.lines):null,rows=ev?Object.entries(q).map(([x,n])=>({name:itemName(x),have:d.items.find(i=>i.id===x)?.qty||0,buy:Math.max(0,n-(d.items.find(i=>i.id===x)?.qty||0))})):d.items.filter(i=>i.qty<=i.min).map(i=>({name:i.name,have:i.qty,buy:Math.max(0,(i.restock??i.min)-i.qty)}));let s=(ev?ev.name:'General restock')+'\n'+rows.map(r=>`${r.name} — have ${r.have}, buy ${r.buy}`).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>alert('Copied')).catch(()=>prompt('Copy list:',s));else prompt('Copy list:',s)}
function renderSettings(){$('settings').innerHTML=`<h2>Customize</h2><div class="card"><h3>My logo</h3>${d.logo?`<img src="${d.logo}" alt="Uploaded logo" style="width:85px;height:85px;object-fit:contain">`:''}<label>Upload logo (small JPG or PNG)</label><input type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadLogo(this)"><p class="muted small">Logo appears in the app header. Large files may exceed phone storage.</p></div><div class="card"><div class="row"><h3>Stock categories</h3><button onclick="editCategory()">+ Category</button></div>${d.categories.map(c=>`<div class="item row"><strong>${esc(c.emoji)} ${esc(c.name)}</strong><button class="alt" onclick="editCategory('${c.id}')">Edit</button></div>`).join('')}</div><div class="card"><h3>Backups</h3><p class="muted small">Export regularly to iCloud Drive. Your information is saved locally on this phone, not synchronized to GitHub.</p><div class="actions"><button onclick="backup()">Download backup</button><button class="alt" onclick="$('restore').click()">Import backup</button></div><input id="restore" hidden type="file" accept="application/json" onchange="restore(this)"></div>`}function editCategory(x=''){let c=d.categories.find(c=>c.id===x)||{name:'',emoji:'📦'};modal(x?'Edit category':'Add category',`<form onsubmit="saveCategory(event,'${x}')"><label>Category name</label><input name="name" required value="${esc(c.name)}"><label>Emoji</label><input name="emoji" value="${esc(c.emoji)}" required><div class="actions"><button>Save category</button>${x?`<button type="button" class="danger" onclick="deleteCategory('${x}')">Delete</button>`:''}</div></form>`)}function saveCategory(e,x){e.preventDefault();let f=e.target,c={id:x||id(),name:f.elements.name.value.trim(),emoji:f.elements.emoji.value.trim()};let old=d.categories.find(c=>c.id===x);if(old)Object.assign(old,c);else d.categories.push(c);done()}function deleteCategory(x){if(d.items.some(i=>catOf(i)?.id===x)){alert('Move all supplies out of this category before deleting it.');return}if(!confirm('Delete empty category?'))return;d.categories=d.categories.filter(c=>c.id!==x);done()}async function uploadLogo(el){let f=el.files[0];if(!f)return;if(f.size>700000){alert('Please use a logo under 700 KB.');return}let r=new FileReader();r.onload=()=>{d.logo=r.result;save();render()};r.readAsDataURL(f)}function backup(){let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cake-pop-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.items)||!Array.isArray(x.recipes)||!Array.isArray(x.orders))throw Error('Invalid backup');if(confirm('Replace all data with this backup?')){d={...seed(),...x};save();render()}}catch(e){alert('Could not restore: '+e.message)}}save();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));</script></body></html>
