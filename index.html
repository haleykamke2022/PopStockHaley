<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b56b91"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PopStock"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><title>PopStock</title><style>*{box-sizing:border-box}body{margin:0;background:var(--brand-bg, #fff7fa);color:#273b30;font:15px system-ui,-apple-system,sans-serif}header{background:var(--brand, #b56b91);color:white;padding:14px 18px;display:flex;gap:12px;align-items:center}header img{width:52px;height:52px;object-fit:contain;border-radius:12px;background:white}h1{font-size:19px;margin:0}h2{font-size:21px;margin:10px 0 16px}h3{margin:8px 0}small,.muted{color:#728175}header small{color:#edf4e8}nav{display:flex;overflow-x:auto;background:#fff;position:sticky;top:0;z-index:3;border-bottom:1px solid #dde6dc}nav button{background:transparent;color:#536f56;white-space:nowrap;flex:1;padding:13px 10px;border-radius:0}nav button.sel{background:#e1ebe0;color:#23442d}button{cursor:pointer;background:var(--brand, #b56b91);border:0;border-radius:11px;padding:10px 13px;color:white;font:600 14px system-ui}button.alt{background:#e4ece3;color:#35543a}button.danger{background:#f9e2df;color:#8d352b}main{max-width:850px;margin:auto;padding:18px 14px 100px}section{display:none}section.show{display:block}.card{background:white;border:1px solid #e2e8dd;border-radius:17px;padding:15px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{text-align:left;background:white;border:1px solid #dce5d9;border-radius:16px;color:#2f4934;min-height:120px;padding:15px;display:flex;flex-direction:column;justify-content:center;gap:7px}.tile .emoji{font-size:29px}.item{padding:12px 0;border-bottom:1px solid #edf1eb}.item:last-child{border:0}.small{font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button{padding:8px 11px}.notice{padding:12px;background:#eaf1e7;border-radius:12px;font-size:13px;margin:10px 0}.warning{background:#fff0d9}.bad{color:#b23d2e}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px;font:inherit;border:1px solid #ccd8ca;border-radius:10px;background:white;color:#293d30}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}.pair{border:1px solid #dfe9dc;border-radius:12px;padding:10px;margin:8px 0}dialog{border:0;border-radius:18px;width:min(96vw,540px);max-height:87vh;overflow:auto;padding:18px;box-shadow:0 15px 70px #26362d77}dialog::backdrop{background:#16291a88}.pill{font-size:12px;padding:5px 8px;border-radius:30px;background:#e7efe4}footer{text-align:center;font-size:12px;color:#7d8b7d;margin:25px 0}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}} .category-drag-handle{touch-action:none;cursor:grab;min-width:44px;min-height:44px;user-select:none;-webkit-user-select:none}.category-sort-row{gap:10px}.category-sort-row.dragging{opacity:.55;background:#e1ebe0;border-radius:10px}.category-sort-row.drag-target{box-shadow:inset 0 3px var(--brand, #b56b91)}.category-drag-handle:active{cursor:grabbing}.home-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.home-heading h2{margin:0 0 5px}.home-heading p{margin:0}.home-eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--brand,#b56b91);margin-bottom:4px!important}.home-date{font-size:12px;color:#728175;white-space:nowrap;margin-top:9px}.home-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.home-stat{background:#fff;text-align:left;color:#293d30;border:1px solid #dce5d9;border-radius:15px;display:flex;flex-direction:column;gap:5px;min-height:117px;padding:15px}.home-stat:focus-visible,.home-actions button:focus-visible{outline:3px solid var(--brand,#b56b91);outline-offset:2px}.home-value{font-size:28px;font-weight:800;line-height:1.1}.home-label{font-size:13px;font-weight:700}.home-arrow{font-size:11px;color:#607468}.home-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.home-actions button{min-height:45px}.home-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf1eb}.home-line:last-child{border-bottom:0}.home-line .alt{flex-shrink:0}.home-line strong{overflow-wrap:anywhere}.home-panels{display:block}@media(min-width:680px){.home-stats{grid-template-columns:repeat(4,1fr)}.home-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.home-panels>.card{margin-top:10px}}</style></head><body><header><img id="brandImage" src="./icons/icon-192.png" alt="App logo"><div><h1>Cake Pop Inventory</h1><small></small></div></header><nav id="nav"></nav><main><section id="home"></section><section id="stock"></section><section id="flavors"></section><section id="orders"></section><section id="events"></section><section id="freezer"></section><section id="shopping"></section><section id="settings"></section><footer>Personal-use app • Saved on this device • Export backups often</footer></main><dialog id="dialog"><div class="row"><h2 id="dialogTitle"></h2><button class="alt" onclick="document.getElementById('dialog').close()">✕</button></div><div id="dialogBody"></div></dialog><script>
const KEY='cakepop_simple_v1',NEW='cakepop_custom_v2';const defaults=['Emulsions','Inclusions','Sprinkles','Almond bark','Cake mixes','Shapes','Packaging'];const icons=['','','','','','',''];const oldNames={'Popper shapes':'Shapes','Popsicle sticks':'Packaging','Wraps':'Packaging','Stickers':'Packaging','Boxes':'Packaging','Decorations':'Packaging','Other':'Packaging'};const seed=()=>({items:[],recipes:[],orders:[],events:[],categories:defaults.map((name,j)=>({id:'c'+j,name,emoji:icons[j]})),logo:'',log:[]});let d;try{d=JSON.parse(localStorage.getItem(NEW))}catch{}if(!d){let old;try{old=JSON.parse(localStorage.getItem(KEY))}catch{}d=seed();if(old&&Array.isArray(old.items)){d.items=olalpha(d.items).map(i=>({...i,type:oldNames[i.type]||i.type,restock:i.restock??Math.max(1,i.min||1)}));d.recipes=old.recipes||[];d.orders=(old.orders||[]).map(o=>({...o,lines:o.lines||[],status:o.status||'Planned',deducted:o.deducted||false}));d.log=old.log||[]}}d.categories ||=seed().categories;d.events ||= [];d.orders ||= [];d.recipes ||= [];d.items ||= [];d.log ||= [];d.logo ||= '';d.freezer ||= [];d.shapes ||= [];d.freezerEnabled ??= true;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),catName=i=>d.categories.find(c=>c.id===i.type)?.name||i.type||'Uncategorized',catOf=i=>d.categories.find(c=>c.id===i.type)||d.categories.find(c=>c.name===i.type),itemName=x=>d.items.find(i=>i.id===x)?.name||'Deleted supply',flavorName=x=>d.recipes.find(r=>r.id===x)?.name||'Deleted flavor';let tab='stock',selected=null;function save(){try{localStorage.setItem(NEW,JSON.stringify(d))}catch(e){alert('Phone storage is full. Export a backup; consider using a smaller logo.')}}function modal(title,body){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialog').showModal()}function done(){save();$('dialog').close();render()}function go(t){tab=t;selected=null;render()}function render(){$('nav').innerHTML=[['stock','Stock'],['flavors','Flavors'],['orders','Orders'],['events','Events'],['freezer','Freezer'],['shopping','Shopping'],['settings','Settings']].map(([t,l])=>`<button class="${tab===t?'sel':''}" onclick="go('${t}')">${l}</button>`).join('');document.querySelectorAll('section').forEach(s=>s.classList.toggle('show',s.id===tab));$('brandImage').src=d.logo||'./icons/icon-192.png';renderStock();renderFlavors();renderPlans('orders');renderPlans('events');renderFreezer();renderShopping();renderSettings()}
function renderStock(){let cats=alpha(d.categories);let html=selected?`<div class="row"><button class="alt" onclick="selected=null;render()">← Categories</button><button onclick="editItem('', '${selected}')">+ Supply</button></div><h2>${esc(cats.find(c=>c.id===selected)?.name||'Stock')}</h2>`:`<div class="row"><h2>My Stock</h2><button onclick="editItem()">+ Supply</button></div><p class="muted">Choose a category to view and update your supplies.</p><div class="grid">${cats.map(c=>`<button class="tile" onclick="selected='${c.id}';render()"><strong>${esc(c.name)}</strong><small>${d.items.filter(i=>catOf(i)?.id===c.id).length} supplies →</small></button>`).join('')}</div>`;if(selected){let list=alpha(d.items.filter(i=>catOf(i)?.id===selected));html+=`<div class="card">${list.length?list.map(i=>`<div class="item"><div class="row"><strong>${esc(i.name)}</strong><span class="pill">${Number(i.qty)} ${esc(i.unit||'packs')}</span></div><div class="small muted">Low at ${i.min||0} · Restock target ${i.restock??i.min??0} ${esc(i.unit||'packs')}</div><div class="actions"><button class="alt" onclick="adjust('${i.id}',1)">+ Add</button><button class="alt" onclick="adjust('${i.id}',-1)">− Use</button><button class="alt" onclick="editItem('${i.id}')">Edit</button></div></div>`).join(''):'<p class="muted">No supplies here yet.</p>'}</div>`} $('stock').innerHTML=html}
function editItem(x='',cat=''){let i=d.items.find(i=>i.id===x)||{name:'',type:cat||d.categories[0]?.id,qty:0,min:1,restock:3,unit:'pack'};modal(x?'Edit stock':'Add stock',`<form onsubmit="saveItem(event,'${x}')"><label>Supply name</label><input name="name" required value="${esc(i.name)}"><label>Category</label><select name="type">${alpha(d.categories).map(c=>`<option value="${c.id}" ${catOf(i)?.id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><div class="formgrid"><div><label>Quantity in stock</label><input name="qty" type="number" step="any" min="0" value="${i.qty}" required></div><div><label>Unit</label><input name="unit" value="${esc(i.unit||'pack')}"></div><div><label>Low stock alert at</label><input name="min" type="number" min="0" step="1" value="${i.min||0}"></div><div><label>Restock target</label><input name="restock" type="number" min="0" step="1" value="${i.restock??i.min??0}"></div></div><div class="actions"><button>Save supply</button>${x?`<button type="button" class="danger" onclick="removeItem('${x}')">Delete</button>`:''}</div></form>`)}function saveItem(e,x){e.preventDefault();let f=e.target,z={id:x||id(),name:f.elements.name.value.trim(),type:f.elements.type.value,qty:+f.elements.qty.value,unit:f.elements.unit.value||'pack',min:+f.elements.min.value,restock:+f.elements.restock.value};let old=d.items.find(i=>i.id===x);if(old)Object.assign(old,z);else d.items.push(z);done()}function removeItem(x){if(!confirm('Delete this supply? Existing flavors may reference it.'))return;d.items=d.items.filter(i=>i.id!==x);done()}function adjust(x,sign){let i=d.items.find(i=>i.id===x),v=prompt(`${sign>0?'Add':'Use'} how many ${i.unit||'packs'} of ${i.name}?`,'1');if(v===null)return;let n=Number(v);if(!Number.isFinite(n)||n<=0||sign<0&&i.qty<n){alert('Enter a valid whole number within available stock.');return}i.qty=+(i.qty+sign*n).toFixed(5);save();render()}
function renderFlavors(){$('flavors').innerHTML=`<div class="row"><h2>My Flavors</h2><button onclick="editFlavor()">+ Flavor</button></div><div class="notice">Save each flavor with the ingredients and packaging used for one batch. Assign flavors to orders or events to plan stock.</div>${alpha(d.recipes).map(r=>`<div class="card"><div class="row"><div><strong>${esc(r.name)}</strong><div class="muted small">Ingredients for one full flavor batch</div></div><button class="alt" onclick="editFlavor('${r.id}')">Edit</button></div><div class="small" style="margin-top:10px">${(r.parts||[]).map(p=>`${esc(itemName(p.id))}: ${p.qty}`).join(' · ')||'No ingredients yet'}</div></div>`).join('')||'<div class="card muted">Add your first flavor to begin.</div>'}`}
function partRow(p={}){let box=document.createElement('div');box.className='pair ingredient';box.innerHTML=`<label>Supply</label><select class="ingredient-id">${alpha(d.items).map(i=>`<option value="${i.id}" ${p.id===i.id?'selected':''}>${esc(i.name)} (${esc(i.unit||'pack')})</option>`).join('')}</select><label>Whole packages per batch</label><input class="ingredient-qty" type="number" min="1" step="1" value="${p.qty||1}"><button type="button" class="alt" style="margin-top:7px" onclick="this.parentElement.remove()">Remove</button>`;$('ingredients').append(box)}function editFlavor(x=''){let r=d.recipes.find(r=>r.id===x)||{name:'',yield:24,parts:[]};modal(x?'Edit flavor':'New flavor',`<form onsubmit="saveFlavor(event,'${x}')"><label>Flavor name</label><input name="name" value="${esc(r.name)}" required><h3>Ingredients and packaging</h3><div class="notice">Enter the number of whole packs/boxes/bottles used per batch. Partial packages aren't tracked in Simple mode.</div><div id="ingredients"></div><button type="button" class="alt" onclick="partRow()">+ Add supply</button><div class="actions"><button>Save flavor</button>${x?`<button type="button" class="danger" onclick="removeFlavor('${x}')">Delete</button>`:''}</div></form>`);(r.parts||[]).forEach(partRow)}function saveFlavor(e,x){e.preventDefault();let f=e.target,parts=[...document.querySelectorAll('.ingredient')].map(b=>({id:b.querySelector('select').value,qty:+b.querySelector('input').value}));if(parts.some(p=>!p.id||!Number.isInteger(p.qty)||p.qty<=0)){alert('Check ingredient amounts.');return}let r={id:x||id(),name:f.elements.name.value.trim(),parts};let old=d.recipes.find(r=>r.id===x);if(old)Object.assign(old,r);else d.recipes.push(r);done()}function removeFlavor(x){if(!confirm('Delete flavor?'))return;d.recipes=d.recipes.filter(r=>r.id!==x);done()}
function quantities(lines){let q={};for(let l of lines||[]){let r=d.recipes.find(r=>r.id===l.flavor);if(!r)continue;let mult=Math.ceil(Number(l.count||0)/Number(r.yield||1));for(let p of r.parts||[])q[p.id]=(q[p.id]||0)+p.qty*mult}return q}function stockShort(q){return Object.entries(q).filter(([x,n])=>(d.items.find(i=>i.id===x)?.qty||0)<n)}function planLinesHTML(lines){return (lines||[]).map(l=>`<div class="small">${esc(flavorName(l.flavor))} — ${l.count} pops</div>`).join('')||'<span class="muted">No flavors selected</span>'}function renderPlans(kind){let isEvent=kind==='events',list=alpha(d[kind]);$(kind).innerHTML=`<div class="row"><h2>${isEvent?'Events':'Orders'}</h2><button onclick="editPlan('${kind}')">+ ${isEvent?'Event':'Order'}</button></div><div class="notice">${isEvent?'Plan flavors and create a shopping list for each event.':'When you change an order to In progress, its planned ingredients are deducted once. You can also mark an event In progress when you pull its supplies.'}</div>${list.map(p=>`<div class="card"><div class="row"><div><strong>${esc(p.name||p.customer||'Untitled')}</strong><div class="small muted">${esc(p.date||p.due||'No date')} · ${esc(p.status||'Planned')}</div></div><button class="alt" onclick="editPlan('${kind}','${p.id}')">Edit</button></div><div style="margin:10px 0">${planLinesHTML(p.lines)}</div><div class="actions">${p.status!=='In progress'&&p.status!=='Completed'?`<button onclick="progress('${kind}','${p.id}')">Start / pull stock</button>`:''}${isEvent?`<button class="alt" onclick="shoppingEvent='${p.id}';go('shopping')">Event shopping list</button>`:''}${p.status==='In progress'?`<button class="alt" onclick="complete('${kind}','${p.id}')">Mark completed</button>`:''}</div></div>`).join('')||'<div class="card muted">Nothing planned yet.</div>'}`}
function addLine(l={}){let el=document.createElement('div');el.className='pair planline';el.innerHTML=`<label>Flavor</label><select class="flavor">${alpha(d.recipes).map(r=>`<option value="${r.id}" ${l.flavor===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select><label>Number of cake pops</label><input class="count" type="number" min="1" step="1" value="${l.count||24}"><button type="button" class="alt" style="margin-top:8px" onclick="this.parentElement.remove()">Remove</button>`;$('planlines').append(el)}function editPlan(kind,x=''){let isEvent=kind==='events',p=d[kind].find(p=>p.id===x)||{name:'',date:'',status:'Planned',lines:[]};if(p.status==='In progress'||p.status==='Completed'){alert('This plan has already started or completed. To protect stock counts, its flavors and quantities cannot be edited.');return}modal(x?'Edit '+(isEvent?'event':'order'):'New '+(isEvent?'event':'order'),`<form onsubmit="savePlan(event,'${kind}','${x}')"><label>${isEvent?'Event name':'Customer / order name'}</label><input name="name" value="${esc(p.name||p.customer||'')}" required><label>${isEvent?'Event date':'Due date'}</label><input type="date" name="date" value="${esc(p.date||p.due||'')}"><h3>Planned flavors</h3><div id="planlines"></div><button type="button" class="alt" onclick="addLine()">+ Add flavor</button><div class="actions"><button>Save ${isEvent?'event':'order'}</button>${x?`<button type="button" class="danger" onclick="deletePlan('${kind}','${x}')">Delete</button>`:''}</div></form>`);(p.lines||[]).forEach(addLine)}function savePlan(e,kind,x){e.preventDefault();let f=e.target,lines=[...document.querySelectorAll('.planline')].map(el=>({flavor:el.querySelector('select').value,count:+el.querySelector('input').value}));if(lines.some(l=>!l.flavor||!Number.isInteger(l.count)||l.count<=0)){alert('Choose a flavor and a valid number of pops.');return}let p={id:x||id(),name:f.elements.name.value.trim(),date:f.elements.date.value,status:'Planned',lines,deducted:false};let old=d[kind].find(p=>p.id===x);if(old)Object.assign(old,p);else d[kind].push(p);done()}function deletePlan(kind,x){if(!confirm('Delete this plan?'))return;d[kind]=d[kind].filter(p=>p.id!==x);done()}function progress(kind,x){let p=d[kind].find(p=>p.id===x);if(!p||p.status!=='Planned')return;if(!p.lines?.length){alert('Add planned flavors first.');return}let q=quantities(p.lines),missing=stockShort(q);if(missing.length){alert('Not enough stock to start. Add these supplies first:\n'+missing.map(([id,n])=>`${itemName(id)}: need ${n}, have ${d.items.find(i=>i.id===id)?.qty||0}`).join('\n'));return}if(!confirm('Mark In progress and deduct the planned supplies from stock now?'))return;for(let [x,n] of Object.entries(q))d.items.find(i=>i.id===x).qty-=n;p.status='In progress';p.deducted=true;p.used=q;d.log.push({type:'Plan started',kind,id:x,date:new Date().toISOString(),used:q});save();render()}function complete(kind,x){let p=d[kind].find(p=>p.id===x);if(p?.status==='In progress'){p.status='Completed';save();render()}}
let shoppingEvent='';function renderShopping(){let options=alpha(d.events).map(e=>`<option value="${e.id}" ${shoppingEvent===e.id?'selected':''}>${esc(e.name)}</option>`).join('');let ev=d.events.find(e=>e.id===shoppingEvent),needs=ev?quantities(ev.lines):{},rows=ev?Object.entries(needs).map(([x,required])=>{let i=d.items.find(i=>i.id===x),have=i?.qty||0;return {name:itemName(x),have,required,buy:Math.max(0,required-have),unit:i?.unit||'pack'}}):d.items.filter(i=>i.qty<=i.min).map(i=>({name:i.name,have:i.qty,required:i.restock??i.min,buy:Math.max(0,(i.restock??i.min)-i.qty),unit:i.unit||'pack'}));$('shopping').innerHTML=`<h2>Shopping Lists</h2><div class="card"><label>View list</label><select onchange="shoppingEvent=this.value;renderShopping()"><option value="">General restock list</option>${options}</select><p class="muted small">${ev?'Shows stock on hand and supplies needed for this event. This does not deduct stock.':'Low-stock items with suggested quantities based on each item’s separate restock target.'}</p></div><div class="card">${rows.length?rows.map(r=>`<div class="item"><div class="row"><strong>${esc(r.name)}</strong>${r.buy>0?`<span class="pill">Buy ${r.buy}</span>`:'<span class="pill">In stock</span>'}</div><div class="small muted">In stock: ${r.have} ${esc(r.unit)} · ${ev?'Event needs':'Target'}: ${r.required} ${esc(r.unit)}</div></div>`).join(''):'<p class="muted">Nothing needed on this list.</p>'}</div><button onclick="copyShop()">Copy this list</button>`}function copyShop(){let ev=d.events.find(e=>e.id===shoppingEvent),q=ev?quantities(ev.lines):null,rows=ev?Object.entries(q).map(([x,n])=>({name:itemName(x),have:d.items.find(i=>i.id===x)?.qty||0,buy:Math.max(0,n-(d.items.find(i=>i.id===x)?.qty||0))})):d.items.filter(i=>i.qty<=i.min).map(i=>({name:i.name,have:i.qty,buy:Math.max(0,(i.restock??i.min)-i.qty)}));let s=(ev?ev.name:'General restock')+'\n'+rows.map(r=>`${r.name} — have ${r.have}, buy ${r.buy}`).join('\n');if(navigator.clipboard?.writeText)nav // Accept decimals, common fractions, Unicode fractions, and mixed numbers.
function recipeAmount(value){
 if(typeof value==='number')return value;
 let t=String(value??'').trim().replace(/[⁄]/g,'/').replace(/[−–]/g,'-');
 const chars={'½':1/2,'¼':1/4,'¾':3/4,'⅓':1/3,'⅔':2/3,'⅛':1/8,'⅜':3/8,'⅝':5/8,'⅞':7/8};
 t=t.replace(/(\d)([½¼¾⅓⅔⅛⅜⅝⅞])/g,'$1 $2');
 if(chars[t]!==undefined)return chars[t];
 const pieces=t.split(/\s+/).filter(Boolean);if(!pieces.length||pieces.length>2)return NaN;
 let sum=0;
 for(const p of pieces){if(chars[p]!==undefined){sum+=chars[p];continue}
   if(/^\d+\s*\/\s*\d+$/.test(p)){const [a,b]=p.split('/').map(Number);if(!b)return NaN;sum+=a/b;continue}
   if(/^\d+(?:\.\d+)?$/.test(p)){sum+=Number(p);continue}
   return NaN;
 }
 return sum;
}
const suggestedRecipeUnits=name=>{

 add(supply?.unit);
 for(let r of d.recipes||[])for(let p of r.parts||[])if(normal(p.name)===n)add(p.unit);
 if(/egg/.test(n))add('each','dozen');
 else if(/cake mix|brownie mix|pudding mix/.test(n))add('box','oz','g','cup');
 else if(/almond bark|chocolate|candy melt|melting wafer/.test(n))add('oz','lb','g','cup','bag');
 else if(/sprinkle|sugar|flour|crumb|powder/.test(n))add('cup','tbsp','tsp','oz','g');
 else if(/butter/.test(n))add('stick','tbsp','cup','oz','g');
 else if(/extract|emulsion|vanilla|oil|water|milk/.test(n))add('tsp','tbsp','cup','ml','oz');
 else if(/stick|bag|box|wrapper|label|packag/.test(n))add('each','pack','box','bag');

function parsePhotoText(){
 const source=$('photoText').value;
 const lines=source.split(/\n/).map(s=>s.trim()).filter(Boolean);
 const units='boxes?|tubs?|bags?|packs?|bottles?|cups?|tablespoons?|teaspoons?|tbsp\\.?|tsp\\.?|ounces?|oz\\.?|lbs?|pounds?|grams?|g|kg|ml|milliliters?|liters?|sticks?|sheets?|each|eggs?|cans?|packages?';

 const unitMap={tablespoon:'tbsp',tablespoons:'tbsp',teaspoon:'tsp',teaspoons:'tsp',ounce:'oz',ounces:'oz',pound:'lb',pounds:'lb',grams:'g',gram:'g',milliliter:'ml',milliliters:'ml',cup:'cup',cups:'cup',boxes:'box',tubs:'tub',bags:'bag',packs:'pack',bottles:'bottle',sticks:'stick',sheets:'sheet',eggs:'each',egg:'each',packages:'pack',package:'pack',cans:'can'};

   line=line.replace(/^[•*\-]\s*/,'').replace(/\s+/g,' ').trim();

   if(m){raw=m[1];unit=m[2]||'';name=m[3]}
   else{m=line.match(after);if(m){name=m[1];raw=m[2];unit=m[3]||''}}
   if(!m){unparsed.push(line);continue}

   unit=unit.toLowerCase().replace(/\.$/,'');
   unit=unitMap[unit]||unit||'';
   if(name&&Number.isFinite(amount)&&amount>0){ingredientRow({name,qty:raw,unit});added++}
   else unparsed.push(line);
 }
 $('photoStatus').textContent=added
 ?'Added '+added+' ingredient(s) for review. '+(unparsed.length?unparsed.length+' line(s) were not understood; check the text box and enter those manually. ':'')+'Verify every amount and unit before saving.'
 :'No ingredient lines recognized automatically. Edit the text or enter ingredients manually. Nothing was saved.';
}

function eventPhotoData(text){
 const lines=String(text||'').split(/\n/).map(v=>v.replace(/\s+/g,' ').trim()).filter(Boolean),sales=[],sold=[];
 for(const line of lines){
  if(/\b(tax|tip|discount|fee|refund|expense|net profit|net sales|cash drawer|change)\b/i.test(line))continue;
  const total=line.match(/^(?:gross\s+sales|total\s+sales|total\s+revenue|gross\s+revenue|sales\s+total|sales|total\s+collected|total)\s*[:=\-]?\s*\$?\s*(\d[\d,]*(?:\.\d{1,2})?)\s*$/i);
  if(total){const value=Number(total[1].replace(/,/g,''));if(Number.isFinite(value))sales.push(value);continue}
  const after=line.match(/^(.+?)\s*(?:sold|qty|quantity|units)\s*[:=\-]?\s*(\d+)\s*$/i);
  const before=line.match(/^(\d+)\s*(?:x|×)?\s+(.+?)(?:\s+sold)?$/i);
  if(after)sold.push({name:after[1].trim(),qty:Number(after[2])});
  else if(before&&!/\d{4}|total|sales|orders/i.test(line))sold.push({name:before[2].trim(),qty:Number(before[1])});
 }
 return {sales,sold};
}

// Standard measurement conversions for recipe needs vs. inventory counts.
// No conversions are guessed for boxes, bottles, tubs, bags, or other packages.
const unitConversion={
 tsp:['volume',1],teaspoon:['volume',1],teaspoons:['volume',1],
 tbsp:['volume',3],tablespoon:['volume',3],tablespoons:['volume',3],
 'fl oz':['volume',6],'fluid oz':['volume',6],'fluid ounce':['volume',6],'fluid ounces':['volume',6],floz:['volume',6],
 cup:['volume',48],cups:['volume',48],
 pint:['volume',96],pints:['volume',96],pt:['volume',96],
 quart:['volume',192],quarts:['volume',192],qt:['volume',192],
 gallon:['volume',768],gallons:['volume',768],gal:['volume',768],
 ml:['volume',0.2028841362],milliliter:['volume',0.2028841362],milliliters:['volume',0.2028841362],
 l:['volume',202.8841362],liter:['volume',202.8841362],liters:['volume',202.8841362],
 g:['weight',1],gram:['weight',1],grams:['weight',1],
 kg:['weight',1000],kilogram:['weight',1000],kilograms:['weight',1000],
 oz:['weight',28.349523125],ounce:['weight',28.349523125],ounces:['weight',28.349523125],
 lb:['weight',453.59237],lbs:['weight',453.59237],pound:['weight',453.59237],pounds:['weight',453.59237],
 each:['count',1],item:['count',1],items:['count',1],dozen:['count',12]
};
function bulkConvertToStock(amount,recipeUnit,item){
 const direct=convertedAmount(amount,recipeUnit,item.unit||'pack');
 if(direct!==null)return direct;
 const countUnit=normal(item.unit||'pack'),size=Number(item.packageSize);
 if(!['bottle','bottles','jug','jugs','container','containers','pack','packs','bag','bags','box','boxes','tub','tubs','jar','jars'].includes(countUnit)||!(size>0))return null;
 const measure=convertedAmount(amount,recipeUnit,item.packageUnit||'');
 return measure===null?null:measure/size;
}
function convertedAmount(quantity,from,to){
 const a=normal(from),b=normal(to);
 if(a===b)return quantity;
 const x=unitConversion[a],y=unitConversion[b];
 if(!x||!y||x[0]!==y[0])return null;
 return quantity*x[1]/y[1];
}
for(const u of ['fl oz','gal','gallon','pint','quart','dozen'])if(!unitOptions.includes(u))unitOptions.push(u);
matchSupply=function(p){
 const matches=d.items.filter(i=>!isShapeStockItem(i)&&((p.id&&i.id===p.id)||(!p.id&&normal(i.name)===normal(p.name))));
 return matches.find(i=>bulkConvertToStock(1,p.unit,i)!==null);
};
// Group requirements in the inventory unit before checking stock or deducting it.
checkRows=function(lines){
 const group=new Map();
 for(const req of requirements(lines)){
  const i=matchSupply(req),amount=i?bulkConvertToStock(req.required,req.unit,i):null;
  if(i&&amount!==null){
   const key='s:'+i.id;
   const r=group.get(key)||{name:i.name,unit:i.unit||'pack',required:0,supply:i,missing:false};
   r.required+=amount;group.set(key,r);
  }else{
   const key='u:'+normal(req.name)+'|'+normal(req.unit);
   const r=group.get(key)||{name:req.name,unit:req.unit,required:0,supply:null,missing:true,unitMismatch:d.items.some(v=>!isShapeStockItem(v)&&normal(v.name)===normal(req.name))};
   r.required+=req.required;group.set(key,r);
  }
 }
 return [...group.values()].map(r=>{
  const have=Number(r.supply?.qty)||0;
  return {...r,have,buy:Math.max(0,r.required-have)};
 });
};
stockReport=function(lines){
 const rows=checkRows(lines);
 return rows.length?rows.map(r=>r.name+': need '+fmt(r.required)+' '+r.unit+
  (r.missing?(r.unitMismatch?', inventory unit is not convertible':', not in Supplies'):
   ', have '+fmt(r.have)+' '+r.unit)+
  (r.buy>0?', buy '+fmt(r.buy)+' '+r.unit:', enough in stock')).join('\n'):
  'No recipe ingredients found. Check your selected shapes and recipes.';
};
progress=function(kind,x){
 const p=d[kind].find(v=>v.id===x);if(!p||p.status!=='Planned')return;
 if(!p.lines?.length){alert('Add planned flavors first.');return}
 for(const a of p.allocations||[]){
  const fr=d.freezer.find(f=>f.id===a.freezer);
  if(!fr||fr.qty<a.qty){alert('Reserved freezer stock is unavailable.');return}
 }
 const rows=checkRows(freshLines(p));
 if(rows.some(r=>r.buy>0||!r.supply)){
  alert('Not enough compatible supplies to start. Review the shopping list.\n\n'+stockReport(freshLines(p)));return;
 }
 if(!confirm('Start this plan? Deduct the converted ingredients and reserved freezer pops?'))return;
 const used={};
 for(const r of rows){
  const i=r.supply;
  i.qty=+Math.max(0,i.qty-r.required).toFixed(8);
  used[i.id]=(used[i.id]||0)+r.required;
 }
 for(const a of p.allocations||[])d.freezer.find(f=>f.id===a.freezer).qty-=a.qty;
 p.status='In progress';p.deducted=true;p.used=used;p.usedFreezer=p.allocations||[];
 d.log.push({type:'Plan started',kind,id:x,date:new Date().toISOString(),used,usedFreezer:p.usedFreezer});
 save();render();
};

function popPackNeeds(lines){let map=new Map();for(let l of lines||[]){let sh=d.shapes.find(s=>s.id===l.shape);if(!sh)continue;for(let key of ['popStick','popBag','popLabel']){let item=d.items.find(i=>i.id===sh[key]);if(!item)continue;let prev=map.get(item.id)||{supply:item,required:0};prev.required+=Number(l.count)||0;map.set(item.id,prev)}}return [...map.values()]}

 '<div class="card"><div class="row"><h3>Upcoming events</h3><button class="alt" onclick="go(\'events\')">All events</button></div>'+homeList('events',events)+'</div></div>'+
 '<div class="card"><div class="row"><h3>Low-stock supplies</h3><button class="alt" onclick="go(\'stock\')">View stock</button></div>'+
 (low.length?low.slice(0,6).map(i=>'<div class="home-line"><div><strong>'+esc(i.name)+'</strong><div class="small muted">'+esc(catName(i))+' · '+fmt(Number(i.qty))+' '+esc(i.unit||'each')+' left · Low at '+fmt(Number(i.min??0))+'</div></div><button class="alt" onclick="go(\'stock\');editItem(\''+i.id+'\')">Edit</button></div>').join(''):'<p class="muted small">No low-stock supplies right now.</p>')+
 (low.length>6?'<p class="muted small">+'+(low.length-6)+' more supplies need attention.</p>':'')+'</div>';
}
const phase2OldRender=render;
render=function(){
 phase2OldRender();
 const nav=$('nav');if(!nav)return;
 nav.innerHTML='<button class="'+(tab==='home'?'sel':'')+'" onclick="go(\'home\')">Home</button>'+nav.innerHTML;
 document.querySelectorAll('main section').forEach(section=>section.classList.toggle('show',section.id===tab));
 renderHome();
};
tab='home';


/* Optional restocking: legacy supplies retain alerts; new supplies default to no restock tracking. */
function restockTracked(i){return i?.restockEnabled!==false}
function restockLowItems(){return alpha(d.items.filter(i=>!isShapeStockItem(i)&&restockTracked(i)&&Number.isFinite(Number(i.qty))&&Number(i.qty)<=Number(i.min??0)))}
const optionalRestockEditBefore=editItem;
editItem=function(x='',cat=''){
 optionalRestockEditBefore(x,cat);
 const form=$('dialogBody')?.querySelector('form');if(!form)return;
 const item=d.items.find(v=>v.id===x),enabled=item?restockTracked(item):false;
 const min=form.elements.min,restock=form.elements.restock;
 if(!min||!restock)return;
 const minBox=min.closest('div'),restockBox=restock.closest('div');
 const grid=min.closest('.formgrid'),toggle=document.createElement('label');
 toggle.className='restock-option';
 toggle.innerHTML='<input type="checkbox" name="restockEnabled" style="width:auto" '+(enabled?'checked':'')+'> Track low stock and restocking';
 grid?.insertAdjacentElement('afterend',toggle);
 const note=document.createElement('p');note.className='muted small';
 note.textContent='Optional. Turn off for seasonal or one-time supplies; they will not appear in general low-stock alerts or restock lists.';
 toggle.insertAdjacentElement('afterend',note);
 const update=()=>{const on=form.elements.restockEnabled.checked;for(const el of [min,restock])el.disabled=!on;for(const el of [minBox,restockBox])if(el)el.style.opacity=on?'1':'0.45'};
 form.elements.restockEnabled.addEventListener('change',update);update();
};
const optionalRestockSaveBefore=saveItem;
saveItem=function(e,x){
 const on=!!e.target.elements.restockEnabled?.checked;
 optionalRestockSaveBefore(e,x);
 const item=d.items.find(v=>v.id===x)||d.items[d.items.length-1];
 if(item){item.restockEnabled=on;save();render()}
};
homeLowStock=function(){return restockLowItems()};
const optionalRestockShoppingBefore=renderShopping;
renderShopping=function(){
 optionalRestockShoppingBefore();
 const p=d[shoppingPlanKind]?.find(v=>v.id===shoppingPlanId);
 if(p)return;
 const cards=$('shopping')?.querySelectorAll('.card');if(!cards?.[1])return;
 const rows=restockLowItems().map(i=>({i,required:Number(i.restock??i.min??0),have:Number(i.qty)||0,buy:Math.max(0,Number(i.restock??i.min??0)-(Number(i.qty)||0))}));
 cards[1].innerHTML=rows.length?rows.map(r=>'<div class="item"><div class="row"><strong>'+esc(r.i.name)+'</strong><span class="pill">'+(r.buy>0?'Buy '+fmt(r.buy)+' '+esc(r.i.unit||'each'):'In stock')+'</span></div><div class="small muted">Have '+fmt(r.have)+' '+esc(r.i.unit||'each')+' · Restock target '+fmt(r.required)+'</div></div>').join(''):'<p class="muted">No tracked supplies currently need restocking.</p>';
};
const optionalRestockCopyBefore=copyShop;
copyShop=function(){
 const p=d[shoppingPlanKind]?.find(v=>v.id===shoppingPlanId);
 if(p)return optionalRestockCopyBefore();
 const rows=restockLowItems().map(i=>{const buy=Math.max(0,Number(i.restock??i.min??0)-Number(i.qty||0));return i.name+' — buy '+fmt(buy)+' '+(i.unit||'each')});
 const output='General restock\n'+(rows.length?rows.join('\n'):'No tracked supplies currently need restocking.');
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(output).then(()=>alert('Copied')).catch(()=>prompt('Copy list:',output));
 else prompt('Copy list:',output);
};
const optionalRestockStockBefore=renderStock;
renderStock=function(){
 optionalRestockStockBefore();
 if(!selected||shapeCategories().some(c=>c.id===selected))return;
 const list=alpha(d.items.filter(i=>catOf(i)?.id===selected));
 const entries=$('stock')?.querySelectorAll('.card .item')||[];
 list.forEach((item,k)=>{
  if(restockTracked(item)||!entries[k])return;
  const detail=entries[k].querySelector('.small.muted');
  if(detail)detail.textContent='Restock tracking off · '+(item.qty??0)+' '+(item.unit||'each')+' in stock';
 });
};


/* Manually request a restock without automatic thresholds. */
const manualLowBefore=homeLowStock;
homeLowStock=function(){const m=new Map();for(const i of [...manualLowBefore(),...d.items.filter(i=>!isShapeStockItem(i)&&i.manualRestock)])m.set(i.id,i);return alpha([...m.values()])};
function toggleRestock(x){const i=d.items.find(v=>v.id===x);if(!i)return;i.manualRestock=!i.manualRestock;save();render()}
const manualEditBefore=editItem;
editItem=function(x='',cat=''){manualEditBefore(x,cat);const f=$('dialogBody')?.querySelector('form');if(!f)return;const i=d.items.find(v=>v.id===x),actions=f.querySelector('.actions');actions?.insertAdjacentHTML('beforebegin','<label><input type="checkbox" name="manualRestock" style="width:auto" '+(i?.manualRestock?'checked':'')+'> Restock this supply now</label><p class="muted small">Manual restock request. No minimum or target required. Uncheck when you have purchased enough.</p>')};
const manualSaveBefore=saveItem;
saveItem=function(e,x){const needed=!!e.target.elements.manualRestock?.checked;manualSaveBefore(e,x);const i=d.items.find(v=>v.id===x)||d.items[d.items.length-1];if(i){i.manualRestock=needed;save();render()}};
const manualStockBefore=renderStock;
renderStock=function(){manualStockBefore();if(!selected||shapeCategories().some(c=>c.id===selected))return;const list=alpha(d.items.filter(i=>catOf(i)?.id===selected)),rows=$('stock')?.querySelectorAll('.card .item')||[];list.forEach((i,k)=>{const actions=rows[k]?.querySelector('.actions');if(!actions)return;const btn=document.createElement('button');btn.type='button';btn.className=i.manualRestock?'danger':'alt';btn.textContent=i.manualRestock?'Clear restock':'Mark restock';btn.addEventListener('click',()=>toggleRestock(i.id));actions.append(btn);if(i.manualRestock){const detail=rows[k].querySelector('.small.muted');if(detail)detail.textContent='Marked for restock · '+fmt(Number(i.qty)||0)+' '+(i.unit||'each')+' on hand'}})};
const manualShopBefore=renderShopping;
renderShopping=function(){manualShopBefore();const p=d[shoppingPlanKind]?.find(v=>v.id===shoppingPlanId);if(p)return;const card=$('shopping')?.querySelectorAll('.card')?.[1];if(!card)return;const rows=homeLowStock();card.innerHTML=rows.length?rows.map(i=>{const target=Number(i.restock??i.min??0),buy=Math.max(0,target-Number(i.qty||0));return '<div class="item"><div class="row"><strong>'+esc(i.name)+'</strong><span class="pill">'+(i.manualRestock?'Restock requested':buy>0?'Buy '+fmt(buy):'Review')+'</span></div><div class="small muted">Have '+fmt(Number(i.qty)||0)+' '+esc(i.unit||'each')+(restockTracked(i)?' · Automatic target '+fmt(target):' · No automatic target')+'</div>'+(i.manualRestock?'<div class="actions"><button type="button" class="alt" onclick="toggleRestock(\''+i.id+'\')">Clear restock</button></div>':'')+'</div>'}).join(''):'<p class="muted">Nothing needs restocking.</p>'};
const manualCopyBefore=copyShop;
copyShop=function(){const p=d[shoppingPlanKind]?.find(v=>v.id===shoppingPlanId);if(p)return manualCopyBefore();const rows=homeLowStock().map(i=>i.name+' — have '+fmt(Number(i.qty)||0)+' '+(i.unit||'each')+(i.manualRestock?' · Restock requested':' · Buy '+fmt(Math.max(0,Number(i.restock??i.min??0)-Number(i.qty||0)))));const output='General restock\n'+(rows.length?rows.join('\n'):'Nothing to restock.');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(output).then(()=>alert('Copied')).catch(()=>prompt('Copy list:',output));else prompt('Copy list:',output)};
const manualHomeBefore=renderHome;
renderHome=function(){manualHomeBefore();const root=$('home');if(!root)return;for(const v of root.querySelectorAll('.home-label,h3'))if(v.textContent==='Low-stock supplies')v.textContent='Restock needed';const title=[...root.querySelectorAll('h3')].find(v=>v.textContent==='Restock needed'),lines=title?.closest('.card')?.querySelectorAll('.home-line')||[];homeLowStock().slice(0,6).forEach((i,k)=>{if(!i.manualRestock||!lines[k])return;const detail=lines[k].querySelector('.small.muted');if(detail)detail.textContent=catName(i)+' · '+fmt(Number(i.qty)||0)+' '+(i.unit||'each')+' left · Marked for restock'})};

save();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));</script></body></html>
