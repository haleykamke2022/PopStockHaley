/* Phase 2 navigation: a compact 4-tab row plus a More menu on all screen sizes. */
#nav{overflow:visible;justify-content:space-between;gap:0}

.home-quote-link strong{overflow-wrap:anywhere}
.home-quote-link:hover,.home-quote-link:focus-visible{background:#f8f2f5}

.production-group{margin-top:20px}
.production-group h3{display:flex;gap:8px;align-items:center}
.production-lines{margin:10px 0;line-height:1.7}
.production-steps{background:#f8f7f7;border-radius:12px;padding:12px;margin:12px 0}
.production-check{display:inline-flex;align-items:center;gap:6px;width:49%;min-height:40px;margin:2px 0;font-size:13px;font-weight:500}
.production-check input{width:auto;flex-shrink:0}

.ps-profit-label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}

.ps-cost-help-text{margin:6px 0 10px;line-height:1.5}

/* Phase 4 Step 2: touch-friendly mobile layout, without changing business logic. */

button{min-height:44px;touch-action:manipulation}
input,select,textarea{min-height:44px}
textarea{min-height:96px;resize:vertical}
.card,.pair,main section{min-width:0;overflow-wrap:anywhere}
:where(button,a,input,select,textarea):focus-visible{outline:3px solid var(--brand,#b56b91);outline-offset:2px}
#nav .pop-more-menu{max-height:min(72vh,540px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

@media(max-width:520px){
 main{padding:14px 12px 95px}

}



.ps-settings-tabs{display:flex;gap:7px;overflow-x:auto;padding:7px 0 13px;scrollbar-width:thin}
.ps-settings-tabs button{flex:0 0 auto;background:#e4ece3;color:#35543a;min-height:44px}
.ps-settings-tabs button.sel{background:var(--brand,#b56b91);color:white}
.ps-settings-panel[hidden],.ps-category-list[hidden]{display:none!important}
.ps-category-list{margin-top:10px}

const KEY='cakepop_simple_v1',NEW='cakepop_custom_v2';const defaults=['Emulsions','Inclusions','Sprinkles','Almond bark','Cake mixes','Shapes','Packaging'];const icons=['','','','','','',''];const oldNames={'Popper shapes':'Shapes','Popsicle sticks':'Packaging','Wraps':'Packaging','Stickers':'Packaging','Boxes':'Packaging','Decorations':'Packaging','Other':'Packaging'};const seed=()=>({items:[],recipes:[],orders:[],events:[],categories:defaults.map((name,j)=>({id:'c'+j,name,emoji:icons[j]})),logo:'',log:[]});let d;try{d=JSON.parse(localStorage.getItem(NEW))}catch{}if(!d){let old;try{old=JSON.parse(localStorage.getItem(KEY))}catch{}d=seed();if(old&&Array.isArray(old.items)){d.items=olalpha(d.items).map(i=>({...i,type:oldNames[i.type]||i.type,restock:i.restock??Math.max(1,i.min||1)}));d.recipes=old.recipes||[];d.orders=(old.orders||[]).map(o=>({...o,lines:o.lines||[],status:o.status||'Planned',deducted:o.deducted||false}));d.log=old.log||[]}}d.categories ||=seed().categories;d.events ||= [];d.orders ||= [];d.recipes ||= [];d.items ||= [];d.log ||= [];d.logo ||= '';d.freezer ||= [];d.shapes ||= [];d.freezerEnabled ??= true;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),catName=i=>d.categories.find(c=>c.id===i.type)?.name||i.type||'Uncategorized',catOf=i=>d.categories.find(c=>c.id===i.type)||d.categories.find(c=>c.name===i.type),itemName=x=>d.items.find(i=>i.id===x)?.name||'Deleted supply',flavorName=x=>d.recipes.find(r=>r.id===x)?.name||'Deleted flavor';let tab='stock',selected=null;function save(){try{localStorage.setItem(NEW,JSON.stringify(d))}catch(e){alert('Phone storage is full. Export a backup; consider using a smaller logo.')}}function modal(title,body){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialog').showModal()}function done(){save();$('dialog').close();render()}function go(t){tab=t;selected=null;render()}function render(){$('nav').innerHTML=[['stock','Stock'],['flavors','Flavors'],['orders','Orders'],['events','Events'],['freezer','Freezer'],['shopping','Shopping'],['settings','Settings']].map(([t,l])=>`<button class="${tab===t?'sel':''}" onclick="go('${t}')">${l}</button>`).join('');document.querySelectorAll('section').forEach(s=>s.classList.toggle('show',s.id===tab));$('brandImage').src=d.logo||'./icons/icon-192.png';renderStock();renderFlavors();renderPlans('orders');renderPlans('events');renderFreezer();renderShopping();renderSettings()}
function renderStock(){let cats=alpha(d.categories);let html=selected?`<div class="row"><button class="alt" onclick="selected=null;render()">← Categories</button><button onclick="editItem('', '${selected}')">+ Supply</button></div><h2>${esc(cats.find(c=>c.id===selected)?.name||'Stock')}</h2>`:`<div class="row"><h2>My Stock</h2><button onclick="editItem()">+ Supply</button></div><p class="muted">Choose a category to view and update your supplies.</p><div class="grid">${cats.map(c=>`<button class="tile" onclick="selected='${c.id}';render()"><strong>${esc(c.name)}</strong><small>${d.items.filter(i=>catOf(i)?.id===c.id).length} supplies →</small></button>`).join('')}</div>`;if(selected){let list=alpha(d.items.filter(i=>catOf(i)?.id===selected));html+=`<div class="card">${list.length?list.map(i=>`<div class="item"><div class="row"><strong>${esc(i.name)}</strong><span class="pill">${Number(i.qty)} ${esc(i.unit||'packs')}</span></div><div class="small muted">Low at ${i.min||0} · Restock target ${i.restock??i.min??0} ${esc(i.unit||'packs')}</div><div class="actions"><button class="alt" onclick="adjust('${i.id}',1)">+ Add</button><button class="alt" onclick="adjust('${i.id}',-1)">− Use</button><button class="alt" onclick="editItem('${i.id}')">Edit</button></div></div>`).join(''):'<p class="muted">No supplies here yet.</p>'}</div>`} $('stock').innerHTML=html}

function renderFlavors(){$('flavors').innerHTML=`<div class="row"><h2>My Flavors</h2><button onclick="editFlavor()">+ Flavor</button></div><div class="notice">Save each flavor with the ingredients and packaging used for one batch. Assign flavors to orders or events to plan stock.</div>${alpha(d.recipes).map(r=>`<div class="card"><div class="row"><div><strong>${esc(r.name)}</strong><div class="muted small">Ingredients for one full flavor batch</div></div><button class="alt" onclick="editFlavor('${r.id}')">Edit</button></div><div class="small" style="margin-top:10px">${(r.parts||[]).map(p=>`${esc(itemName(p.id))}: ${p.qty}`).join(' · ')||'No ingredients yet'}</div></div>`).join('')||'<div class="card muted">Add your first flavor to begin.</div>'}`}

function eventPhotoData(text){
 const lines=String(text||'').split(/\n/).map(v=>v.replace(/\s+/g,' ').trim()).filter(Boolean),sales=[],sold=[];

  const before=line.match(/^(\d+)\s*(?:x|×)?\s+(.+?)(?:\s+sold)?$/i);

}

const unitConversion={
 tsp:['volume',1],teaspoon:['volume',1],teaspoons:['volume',1],

function bulkConvertToStock(amount,recipeUnit,item){
 const direct=convertedAmount(amount,recipeUnit,item.unit||'pack');
 if(direct!==null)return direct;
 const countUnit=normal(item.unit||'pack'),size=Number(item.packageSize);
 if(!['bottle','bottles','jug','jugs','container','containers','pack','packs','bag','bags','box','boxes','tub','tubs','jar','jars'].includes(countUnit)||!(size>0))return null;
 const measure=convertedAmount(amount,recipeUnit,item.packageUnit||'');
 return measure===null?null:measure/size;
}
function convertedAmount(quantity,from,to){
 const a=normal(from),b=normal(to);
 if(a===b)return quantity;
 const x=unitConversion[a],y=unitConversion[b];
 if(!x||!y||x[0]!==y[0])return null;
 return quantity*x[1]/y[1];
}

 const matches=d.items.filter(i=>!isShapeStockItem(i)&&((p.id&&i.id===p.id)||(!p.id&&normal(i.name)===normal(p.name))));
 return matches.find(i=>bulkConvertToStock(1,p.unit,i)!==null);
};

checkRows=function(lines){
 const group=new Map();
 for(const req of requirements(lines)){
  const i=matchSupply(req),amount=i?bulkConvertToStock(req.required,req.unit,i):null;
  if(i&&amount!==null){
   const key='s:'+i.id;
   const r=group.get(key)||{name:i.name,unit:i.unit||'pack',required:0,supply:i,missing:false};
   r.required+=amount;group.set(key,r);

/* Phase 1: consistent costs and safer stock accounting. */
function p1Cost(p){
 const stock=p.id?d.items.filter(i=>i.id===p.id):d.items.filter(i=>normal(i.name)===normal(p.name));
 const candidates=stock.filter(i=>!isShapeStockItem(i)).map(i=>({price:Number(i.packageCost),size:Number(i.packageSize),unit:i.packageUnit||i.unit,source:'My Stock'}))
  
  .concat([{price:Number(p.recipeCostPrice),size:Number(p.recipeCostSize),unit:p.recipeCostUnit,source:'Recipe-only'}]);
 for(const c of candidates){if(!(c.price>0&&c.size>0))continue;const amount=convertedAmount(Number(p.qty)||0,p.unit,c.unit);if(amount!==null)return {cost:amount*c.price/c.size,unknown:false,source:c.source}}
 return {cost:0,unknown:true,reason:'No saved price or compatible package measurement'};
}

function p1PackNeeds(lines,keys){
 const map=new Map();
 for(const l of lines||[]){const shape=d.shapes.find(s=>s.id===l.shape);if(!shape)continue;
 for(const key of keys){if(!shape[key])continue;const item=d.items.find(i=>i.id===shape[key]);if(!item)continue;
  const current=map.get(item.id)||{item,pieces:0};current.pieces+=Number(l.count)||0;map.set(item.id,current)}}
 return [...map.values()];
}
function p1PackAmounts(entries){
 const map=new Map(),issues=[];
 for(const v of entries){const qty=bulkConvertToStock(v.pieces,'each',v.item);
  if(qty===null){issues.push(v.item.name+': track as "each", or specify the package size in "each".');continue}
  const row=map.get(v.item.id)||{item:v.item,qty:0};row.qty+=qty;map.set(v.item.id,row)}
 for(const v of map.values())if(Number(v.item.qty)+1e-8<v.qty)issues.push(v.item.name+': need '+fmt(v.qty)+' '+v.item.unit+', have '+fmt(Number(v.item.qty)||0));
 return {map,issues};
}

}

d.shoppingChecklists ||= {};

 const plan=shopCurrentPlan();
 if(!plan)return homeLowStock().map(i=>({key:'s:'+i.id,name:i.name,id:i.id,unit:i.unit||'each',have:Number(i.qty)||0,
  need:i.manualRestock?'Restock requested':'Buy '+fmt(Math.max(0,Number(i.restock??i.min??0)-Number(i.qty||0)))+' '+(i.unit||'each')}));
 const rows=checkRows(freshLines(plan)).filter(r=>r.missing||r.buy>0);

 if(shoppingPlanKind==='events'&&typeof evtPack==='function'){
  const total=(plan.lines||[]).reduce((n,l)=>n+Number(l.count||0),0);
  const packageData=evtPack(plan,total);
  for(const row of packageData.rows||[]){
   const buy=Math.max(0,row.qty-Number(row.item.qty||0));
   if(buy>0&&!needs.some(n=>n.id===row.item.id))needs.push({key:'s:'+row.item.id,name:row.item.name,id:row.item.id,unit:row.item.unit||'each',have:Number(row.item.qty)||0,need:'Buy '+fmt(buy)+' '+(row.item.unit||'each')});
  }
 }
 return needs.sort((a,b)=>a.name.localeCompare(b.name));
}

 const listKey=shopKey(),current=d.shoppingChecklists[listKey]||{bought:{},archived:false};
 if(action==='restart'){d.shoppingChecklists[listKey]={bought:{},archived:false}}
 else if(action==='delete'){
  const rows=shopNeeds();
  if((!rows.length&&!Object.keys(current.bought).length)||rows.some(r=>!current.bought[r.key]))return;
  if(!confirm('Delete this completed shopping checklist? Your stock, orders, events, and restock settings will stay unchanged.'))return;
  d.shoppingChecklists[listKey]={bought:{},archived:true};
 }else if(action==='bought'){current.bought[key]=true;current.archived=false;d.shoppingChecklists[listKey]=current}
 else if(action==='undo'){delete current.bought[key];d.shoppingChecklists[listKey]=current}
 save();renderShopping();
}

function freeWater(n){return /^(water|tap water|sink water)$/i.test(String(n||'').trim())}

const priorCostWater=p1Cost;
p1Cost=function(part){if(freeWater(part.name||d.items.find(i=>i.id===part.id)?.name))return {cost:0,unknown:false,source:'Free tap water'};return priorCostWater(part)};

function receiptRows(){
 const current=shopNeeds().filter(r=>!freeWater(r.name)),seen=new Set(current.map(r=>r.key));
 const saved=d.shoppingChecklists[shopKey()]?.bought||{};
 for(const [key,v] of Object.entries(saved)){

function psForecast(p){
 const f=p.forecast||{}, price=Number(f.price??4), planned=(p.lines||[]).reduce((n,l)=>n+Math.max(0,Number(l.count)||0),0);
 let ingredients=0,unknown=0,unresolved=0;
 for(const l of p.lines||[]){
  if(!(Number(l.count)>0))continue;
  const r=d.recipes.find(v=>v.id===l.flavor),yieldSize=r?Number(effectiveYield(r,l)):0;
  if(!r||!(yieldSize>0)){unresolved++;continue}
  const c=flavorCost(r);ingredients+=c.cost*Math.ceil(Number(l.count)/yieldSize);unknown+=c.unknown;
 }
 const expenses=eventExpenses(p),extra=Number(f.extra??0),total=ingredients+expenses+extra;
 const scenarios=[Number(f.low??40),Number(f.expected??70),Number(f.high??100)].map(rate=>{
  const sold=Math.floor(planned*rate/100),revenue=sold*price;
  return {rate,sold,revenue,profit:revenue-total};
 });
 return {price,planned,ingredients,unknown,unresolved,expenses,extra,total,scenarios,breakEven:price>0?Math.ceil(total/price):null};
}

function psRecordedSupplyCost(usage){
 let total=0,missing=[];
 for(const [sid,quantity] of Object.entries(usage||{})){
  const i=d.items.find(v=>v.id===sid),n=Number(quantity);
  if(!i||!Number.isFinite(n)||n<0){missing.push(i?.name||'Deleted ingredient');continue}
  const rate=Number(i.packageCost),size=Number(i.packageSize),unit=i.packageUnit||i.unit||'each';
  const factor=convertedAmount(1,i.unit||unit,unit);
  if(i.packageCost===undefined||!Number.isFinite(rate)||!(size>0)||factor===null){missing.push(i.name);continue}
  total+=n*factor*rate/size;
 }
 return {total,missing};
}

const psSyncMetadataKey='popstock_sync_readiness_v1';
function psSyncMetadata(){
 let meta;try{meta=JSON.parse(localStorage.getItem(psSyncMetadataKey)||'null')}catch{}
 if(meta&&typeof meta.installId==='string'&&meta.installId.length>10)return meta;
 meta={schema:1,installId:'ps-'+id(),createdAt:new Date().toISOString()};
 try{localStorage.setItem(psSyncMetadataKey,JSON.stringify(meta))}catch{}
 return meta;
}
function psSyncAudit(){
 const categories=['items','recipes','orders','events','customerQuotes','freezer','shapes','shoppingChecklists','priceHistory'];
 const counts={},problems=[];
 for(const key of categories){
  if(key==='shoppingChecklists'){counts[key]=Object.keys(d[key]||{}).length;continue}
  if(d[key]!==undefined&&!Array.isArray(d[key]))problems.push(key+' should be a list');
  counts[key]=Array.isArray(d[key])?d[key].length:0;
  if(Array.isArray(d[key])){
   const ids=new Set();
   for(const record of d[key]){
    if(!record||typeof record!=='object'){problems.push(key+' contains an invalid record');continue}
    if(!record.id)continue;
    if(ids.has(record.id))problems.push(key+' has duplicate record IDs');
    ids.add(record.id);
   }
  }
 }
 let bytes=0;try{bytes=new Blob([JSON.stringify(d)]).size}catch{problems.push('Unable to serialize app data')}
 return {counts,problems:[...new Set(problems)],bytes};
}
function psExportSyncManifest(){
 const meta=psSyncMetadata(),audit=psSyncAudit();
 if(audit.problems.length){alert('Readiness issues found. Export a normal PopStock backup and review the list before attempting future migration.');return}
 const manifest={format:'popstock-sync-readiness',version:1,createdAt:new Date().toISOString(),installId:meta.installId,storageKey:NEW,counts:audit.counts,approxDataBytes:audit.bytes,note:'Metadata only. This file is NOT an app-data backup and cannot restore records.'};
 const blob=new Blob([JSON.stringify(manifest,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download='popstock-sync-readiness-'+new Date().toISOString().slice(0,10)+'.json';link.click();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}

/* Phase 4 Step 4: Read-only backup file inspection. No restore or data mutation. */
async function psInspectBackupFile(file){
 if(!file)return;
 const output=$('psBackupCheckResult');if(!output)return;
 output.textContent='Checking backup file...';
 try{
  if(file.size>15000000)throw Error('Backup exceeds the 15 MB safety limit.');
  const x=JSON.parse(await file.text());
  if(!x||typeof x!=='object'||Array.isArray(x))throw Error('Expected a PopStock backup object.');
  for(const key of ['items','recipes','orders']){
   if(!Array.isArray(x[key]))throw Error('Missing or invalid '+key+' records.');
  }
  for(const key of ['events','categories','customerQuotes','shapes','freezer','priceHistory']){
   if(x[key]!==undefined&&!Array.isArray(x[key]))throw Error('Invalid '+key+' records.');
  }
  if(x.shoppingChecklists!==undefined&&(typeof x.shoppingChecklists!=='object'||Array.isArray(x.shoppingChecklists)||x.shoppingChecklists===null))throw Error('Invalid shopping checklists.');
  const keys=['items','recipes','orders','events','customerQuotes','shapes','freezer','priceHistory'];
  const messages=[];
  for(const key of keys){
   const rows=Array.isArray(x[key])?x[key]:[];
   const seen=new Set();
   for(const entry of rows){
    if(!entry||typeof entry!=='object'||Array.isArray(entry))throw Error('Invalid '+key+' entry.');
    if(entry.id){if(seen.has(entry.id))messages.push('Duplicate '+key+' ID');seen.add(entry.id)}
   }
  }
  if(messages.length)throw Error([...new Set(messages)].join('; '));
  const counts=keys.map(key=>key+': '+(x[key]?.length||0)).join(' · ');
  output.textContent='File structure looks valid. '+counts+'. This is a read-only check; no data was restored or changed. This does not guarantee every record can be restored.';
 }catch(e){output.textContent='Backup check failed: '+e.message+'. Current PopStock data has not been changed.'}
}

/* Settings organization: onboarding, business, stock, backups, and general. */
let psSettingsActive='start';
const psBeforeOrganizedSettings=renderSettings;
renderSettings=function(){
 psBeforeOrganizedSettings();
 const root=$('settings');if(!root)return;
 const sections=[
  {key:'start',label:'Getting Started'},
  {key:'business',label:'Business'},
  {key:'stock',label:'Stock & Freezer'},
  {key:'backup',label:'Backups & Data'},
  {key:'general',label:'General & Help'}
 ];
 const headings={
  'Getting Started Guide':'start','Getting Started':'start','Home screen reminder':'start',
  'Business branding':'business','Optional Business tab':'business','Optional business expenses':'business',
  'Hourly labor rates':'business','Sell-through assumptions':'business','Optional custom-order add-ons':'business',
  'Stock categories':'stock','Freezer settings':'stock','Popper shapes and yields':'stock',
  'Backups':'backup','Protect your data':'backup','Sync Readiness':'backup','Backup File Check':'backup',
  'My logo':'general','Help & Feedback':'general'
 };
 const children=[...root.children];
 const groups=Object.fromEntries(sections.map(x=>[x.key,document.createElement('div')]));
 for(const el of children){
  if(el.tagName==='H2'&&el.textContent.trim()==='Customize'){el.remove();continue}
  const heading=el.querySelector('h3')?.textContent.trim();
  const key=headings[heading]||'general';
  if(heading==='Stock categories'){
   const headingNode=el.querySelector('h3');
   const row=headingNode?.closest('.row');
   if(row){
    const toggle=document.createElement('button');
    toggle.type='button';toggle.className='alt';
    const content=document.createElement('div');
    content.className='ps-category-list';
    const categoryRows=[...el.querySelectorAll('.category-sort-row')];
    for(const item of categoryRows)content.appendChild(item);
    const collapsed=sessionStorage.getItem('ps_stock_categories_collapsed')==='1';
    content.hidden=collapsed;toggle.textContent=collapsed?'Expand categories':'Collapse categories';
    toggle.setAttribute('aria-expanded',String(!collapsed));
    toggle.addEventListener('click',()=>{
     content.hidden=!content.hidden;
     toggle.textContent=content.hidden?'Expand categories':'Collapse categories';
     toggle.setAttribute('aria-expanded',String(!content.hidden));
     try{sessionStorage.setItem('ps_stock_categories_collapsed',content.hidden?'1':'0')}catch{}
    });
    row.insertAdjacentElement('afterend',toggle);toggle.insertAdjacentElement('afterend',content);
   }
  }
  groups[key].appendChild(el);
 }
 const tabs=document.createElement('div');tabs.className='ps-settings-tabs';tabs.setAttribute('role','group');tabs.setAttribute('aria-label','Settings sections');
 for(const info of sections){
  const button=document.createElement('button');button.type='button';button.textContent=info.label;
  button.dataset.settingsTab=info.key;
  button.addEventListener('click',()=>psShowSettingsTab(info.key));
  tabs.appendChild(button);
 }
 root.appendChild(tabs);
 for(const info of sections){
  const panel=document.createElement('div');panel.dataset.settingsPanel=info.key;
  panel.className='ps-settings-panel';panel.appendChild(groups[info.key]);root.appendChild(panel);
 }
 psShowSettingsTab(psSettingsActive);
};
function psShowSettingsTab(key){
 const root=$('settings');if(!root)return;
 psSettingsActive=key;
 root.querySelectorAll('[data-settings-tab]').forEach(b=>{const yes=b.dataset.settingsTab===key;b.classList.toggle('sel',yes);b.setAttribute('aria-pressed',String(yes))});
 root.querySelectorAll('[data-settings-panel]').forEach(p=>p.hidden=p.dataset.settingsPanel!==key);
}
