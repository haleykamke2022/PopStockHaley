const KEY='cakepop_simple_v1',NEW='cakepop_custom_v2';const defaults=['Emulsions','Inclusions','Sprinkles','Almond bark','Cake mixes','Shapes','Packaging'];const icons=['🧴','🍪','🌈','🍫','🎂','💗','🎁'];const oldNames={'Popper shapes':'Shapes','Popsicle sticks':'Packaging','Wraps':'Packaging','Stickers':'Packaging','Boxes':'Packaging','Decorations':'Packaging','Other':'Packaging'};const seed=()=>({items:[],recipes:[],orders:[],events:[],categories:defaults.map((name,j)=>({id:'c'+j,name,emoji:icons[j]})),logo:'',log:[]});let d;try{d=JSON.parse(localStorage.getItem(NEW))}catch{}if(!d){let old;try{old=JSON.parse(localStorage.getItem(KEY))}catch{}d=seed();if(old&&Array.isArray(old.items)){d.items=old.items.map(i=>({...i,type:oldNames[i.type]||i.type,restock:i.restock??Math.max(1,i.min||1)}));d.recipes=old.recipes||[];d.orders=(old.orders||[]).map(o=>({...o,lines:o.lines||[],status:o.status||'Planned',deducted:o.deducted||false}));d.log=old.log||[]}}d.categories ||=seed().categories;d.events ||= [];d.orders ||= [];d.recipes ||= [];d.items ||= [];d.log ||= [];d.logo ||= '';d.freezer ||= [];d.shapes ||= [];d.freezerEnabled ??= true;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),catName=i=>d.categories.find(c=>c.id===i.type)?.name||i.type||'Uncategorized',catOf=i=>d.categories.find(c=>c.id===i.type)||d.categories.find(c=>c.name===i.type),itemName=x=>d.items.find(i=>i.id===x)?.name||'Deleted supply',flavorName=x=>d.recipes.find(r=>r.id===x)?.name||'Deleted flavor';let tab='stock',selected=null;function save(){try{localStorage.setItem(NEW,JSON.stringify(d))}catch(e){alert('Phone storage is full. Export a backup; consider using a smaller logo.')}}function modal(title,body){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialog').showModal()}function done(){save();$('dialog').close();render()}function go(t){tab=t;selected=null;render()}function render(){$('nav').innerHTML=[['stock','📦 Stock'],['flavors','🧁 Flavors'],['orders','📋 Orders'],['events','🎪 Events'],['freezer','❄️ Freezer'],['shopping','🛒 Shopping'],['settings','⚙️ Settings']].map(([t,l])=>`<button class="${tab===t?'sel':''}" onclick="go('${t}')">${l}</button>`).join('');document.querySelectorAll('section').forEach(s=>s.classList.toggle('show',s.id===tab));$('brandImage').src=d.logo||'./icons/icon-192.png';renderStock();renderFlavors();renderPlans('orders');renderPlans('events');renderFreezer();renderShopping();renderSettings()}
function renderStock(){let cats=d.categories;let html=selected?`<div class="row"><button class="alt" onclick="selected=null;render()">← Categories</button><button onclick="editItem('', '${selected}')">+ Supply</button></div><h2>${esc(cats.find(c=>c.id===selected)?.emoji||'📦')} ${esc(cats.find(c=>c.id===selected)?.name||'Stock')}</h2>`:`<div class="row"><h2>My Stock</h2><button onclick="editItem()">+ Supply</button></div><p class="muted">Choose a category to view and update your supplies.</p><div class="grid">${cats.map(c=>`<button class="tile" onclick="selected='${c.id}';render()"><span class="emoji">${esc(c.emoji)}</span><strong>${esc(c.name)}</strong><small>${d.items.filter(i=>catOf(i)?.id===c.id).length} supplies →</small></button>`).join('')}</div>`;if(selected){let list=d.items.filter(i=>catOf(i)?.id===selected);html+=`<div class="card">${list.length?list.map(i=>`<div class="item"><div class="row"><strong>${esc(i.name)}</strong><span class="pill">${Number(i.qty)} ${esc(i.unit||'packs')}</span></div><div class="small muted">Low at ${i.min||0} · Restock target ${i.restock??i.min??0} ${esc(i.unit||'packs')}</div><div class="actions"><button class="alt" onclick="adjust('${i.id}',1)">+ Add</button><button class="alt" onclick="adjust('${i.id}',-1)">− Use</button><button class="alt" onclick="editItem('${i.id}')">Edit</button></div></div>`).join(''):'<p class="muted">No supplies here yet.</p>'}</div>`} $('stock').innerHTML=html}
function editItem(x='',cat=''){let i=d.items.find(i=>i.id===x)||{name:'',type:cat||d.categories[0]?.id,qty:0,min:1,restock:3,unit:'pack'};modal(x?'Edit stock':'Add stock',`<form onsubmit="saveItem(event,'${x}')"><label>Supply name</label><input name="name" required value="${esc(i.name)}"><label>Category</label><select name="type">${d.categories.map(c=>`<option value="${c.id}" ${catOf(i)?.id===c.id?'selected':''}>${esc(c.emoji)} ${esc(c.name)}</option>`).join('')}</select><div class="formgrid"><div><label>Quantity in stock</label><input name="qty" type="number" step="1" min="0" value="${i.qty}" required></div><div><label>Unit</label><input name="unit" value="${esc(i.unit||'pack')}"></div><div><label>Low stock alert at</label><input name="min" type="number" min="0" step="1" value="${i.min||0}"></div><div><label>Restock target</label><input name="restock" type="number" min="0" step="1" value="${i.restock??i.min??0}"></div></div><div class="actions"><button>Save supply</button>${x?`<button type="button" class="danger" onclick="removeItem('${x}')">Delete</button>`:''}</div></form>`)}function saveItem(e,x){e.preventDefault();let f=e.target,z={id:x||id(),name:f.elements.name.value.trim(),type:f.elements.type.value,qty:+f.elements.qty.value,unit:f.elements.unit.value||'pack',min:+f.elements.min.value,restock:+f.elements.restock.value};let old=d.items.find(i=>i.id===x);if(old)Object.assign(old,z);else d.items.push(z);done()}function removeItem(x){if(!confirm('Delete this supply? Existing flavors may reference it.'))return;d.items=d.items.filter(i=>i.id!==x);done()}function adjust(x,sign){let i=d.items.find(i=>i.id===x),v=prompt(`${sign>0?'Add':'Use'} how many ${i.unit||'packs'} of ${i.name}?`,'1');if(v===null)return;let n=Number(v);if(!Number.isInteger(n)||n<=0||sign<0&&i.qty<n){alert('Enter a valid whole number within available stock.');return}i.qty+=sign*n;save();render()}
function renderFlavors(){$('flavors').innerHTML=`<div class="row"><h2>My Flavors</h2><button onclick="editFlavor()">+ Flavor</button></div><div class="notice">Save each flavor with the ingredients and packaging used for one batch. Assign flavors to orders or events to plan stock.</div>${d.recipes.map(r=>`<div class="card"><div class="row"><div><strong>${esc(r.name)}</strong><div class="muted small">Makes ${r.yield||1} cake pops per batch</div></div><button class="alt" onclick="editFlavor('${r.id}')">Edit</button></div><div class="small" style="margin-top:10px">${(r.parts||[]).map(p=>`${esc(itemName(p.id))}: ${p.qty}`).join(' · ')||'No ingredients yet'}</div></div>`).join('')||'<div class="card muted">Add your first flavor to begin.</div>'}`}
function partRow(p={}){let box=document.createElement('div');box.className='pair ingredient';box.innerHTML=`<label>Supply</label><select class="ingredient-id">${d.items.map(i=>`<option value="${i.id}" ${p.id===i.id?'selected':''}>${esc(i.name)} (${esc(i.unit||'pack')})</option>`).join('')}</select><label>Whole packages per batch</label><input class="ingredient-qty" type="number" min="1" step="1" value="${p.qty||1}"><button type="button" class="alt" style="margin-top:7px" onclick="this.parentElement.remove()">Remove</button>`;$('ingredients').append(box)}function editFlavor(x=''){let r=d.recipes.find(r=>r.id===x)||{name:'',yield:24,parts:[]};modal(x?'Edit flavor':'New flavor',`<form onsubmit="saveFlavor(event,'${x}')"><label>Flavor name</label><input name="name" value="${esc(r.name)}" required><label>Number of pops made per batch</label><input name="yield" type="number" min="1" step="1" value="${r.yield||24}" required><h3>Ingredients and packaging</h3><div class="notice">Enter the number of whole packs/boxes/bottles used per batch. Partial packages aren't tracked in Simple mode.</div><div id="ingredients"></div><button type="button" class="alt" onclick="partRow()">+ Add supply</button><div class="actions"><button>Save flavor</button>${x?`<button type="button" class="danger" onclick="removeFlavor('${x}')">Delete</button>`:''}</div></form>`);(r.parts||[]).forEach(partRow)}function saveFlavor(e,x){e.preventDefault();let f=e.target,parts=[...document.querySelectorAll('.ingredient')].map(b=>({id:b.querySelector('select').value,qty:+b.querySelector('input').value}));if(parts.some(p=>!p.id||!Number.isInteger(p.qty)||p.qty<=0)){alert('Check ingredient amounts.');return}let r={id:x||id(),name:f.elements.name.value.trim(),yield:+f.elements.yield.value,parts};let old=d.recipes.find(r=>r.id===x);if(old)Object.assign(old,r);else d.recipes.push(r);done()}function removeFlavor(x){if(!confirm('Delete flavor?'))return;d.recipes=d.recipes.filter(r=>r.id!==x);done()}
function quantities(lines){let q={};for(let l of lines||[]){let r=d.recipes.find(r=>r.id===l.flavor);if(!r)continue;let mult=Math.ceil(Number(l.count||0)/Number(r.yield||1));for(let p of r.parts||[])q[p.id]=(q[p.id]||0)+p.qty*mult}return q}function stockShort(q){return Object.entries(q).filter(([x,n])=>(d.items.find(i=>i.id===x)?.qty||0)<n)}function planLinesHTML(lines){return (lines||[]).map(l=>`<div class="small">${esc(flavorName(l.flavor))} — ${l.count} pops</div>`).join('')||'<span class="muted">No flavors selected</span>'}function renderPlans(kind){let isEvent=kind==='events',list=d[kind];$(kind).innerHTML=`<div class="row"><h2>${isEvent?'Events':'Orders'}</h2><button onclick="editPlan('${kind}')">+ ${isEvent?'Event':'Order'}</button></div><div class="notice">${isEvent?'Plan flavors and create a shopping list for each event.':'When you change an order to In progress, its planned ingredients are deducted once. You can also mark an event In progress when you pull its supplies.'}</div>${list.map(p=>`<div class="card"><div class="row"><div><strong>${esc(p.name||p.customer||'Untitled')}</strong><div class="small muted">${esc(p.date||p.due||'No date')} · ${esc(p.status||'Planned')}</div></div><button class="alt" onclick="editPlan('${kind}','${p.id}')">Edit</button></div><div style="margin:10px 0">${planLinesHTML(p.lines)}</div><div class="actions">${p.status!=='In progress'&&p.status!=='Completed'?`<button onclick="progress('${kind}','${p.id}')">Start / pull stock</button>`:''}${isEvent?`<button class="alt" onclick="shoppingEvent='${p.id}';go('shopping')">Event shopping list</button>`:''}${p.status==='In progress'?`<button class="alt" onclick="complete('${kind}','${p.id}')">Mark completed</button>`:''}</div></div>`).join('')||'<div class="card muted">Nothing planned yet.</div>'}`}
function addLine(l={}){let el=document.createElement('div');el.className='pair planline';el.innerHTML=`<label>Flavor</label><select class="flavor">${d.recipes.map(r=>`<option value="${r.id}" ${l.flavor===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select><label>Number of cake pops</label><input class="count" type="number" min="1" step="1" value="${l.count||24}"><button type="button" class="alt" style="margin-top:8px" onclick="this.parentElement.remove()">Remove</button>`;$('planlines').append(el)}function editPlan(kind,x=''){let isEvent=kind==='events',p=d[kind].find(p=>p.id===x)||{name:'',date:'',status:'Planned',lines:[]};if(p.status==='In progress'||p.status==='Completed'){alert('This plan has already started or completed. To protect stock counts, its flavors and quantities cannot be edited.');return}modal(x?'Edit '+(isEvent?'event':'order'):'New '+(isEvent?'event':'order'),`<form onsubmit="savePlan(event,'${kind}','${x}')"><label>${isEvent?'Event name':'Customer / order name'}</label><input name="name" value="${esc(p.name||p.customer||'')}" required><label>${isEvent?'Event date':'Due date'}</label><input type="date" name="date" value="${esc(p.date||p.due||'')}"><h3>Planned flavors</h3><div id="planlines"></div><button type="button" class="alt" onclick="addLine()">+ Add flavor</button><div class="actions"><button>Save ${isEvent?'event':'order'}</button>${x?`<button type="button" class="danger" onclick="deletePlan('${kind}','${x}')">Delete</button>`:''}</div></form>`);(p.lines||[]).forEach(addLine)}function savePlan(e,kind,x){e.preventDefault();let f=e.target,lines=[...document.querySelectorAll('.planline')].map(el=>({flavor:el.querySelector('select').value,count:+el.querySelector('input').value}));if(lines.some(l=>!l.flavor||!Number.isInteger(l.count)||l.count<=0)){alert('Choose a flavor and a valid number of pops.');return}let p={id:x||id(),name:f.elements.name.value.trim(),date:f.elements.date.value,status:'Planned',lines,deducted:false};let old=d[kind].find(p=>p.id===x);if(old)Object.assign(old,p);else d[kind].push(p);done()}function deletePlan(kind,x){if(!confirm('Delete this plan?'))return;d[kind]=d[kind].filter(p=>p.id!==x);done()}function progress(kind,x){let p=d[kind].find(p=>p.id===x);if(!p||p.status!=='Planned')return;if(!p.lines?.length){alert('Add planned flavors first.');return}let q=quantities(p.lines),missing=stockShort(q);if(missing.length){alert('Not enough stock to start. Add these supplies first:\n'+missing.map(([id,n])=>`${itemName(id)}: need ${n}, have ${d.items.find(i=>i.id===id)?.qty||0}`).join('\n'));return}if(!confirm('Mark In progress and deduct the planned supplies from stock now?'))return;for(let [x,n] of Object.entries(q))d.items.find(i=>i.id===x).qty-=n;p.status='In progress';p.deducted=true;p.used=q;d.log.push({type:'Plan started',kind,id:x,date:new Date().toISOString(),used:q});save();render()}function complete(kind,x){let p=d[kind].find(p=>p.id===x);if(p?.status==='In progress'){p.status='Completed';save();render()}}
let shoppingEvent='';function renderShopping(){let options=d.events.map(e=>`<option value="${e.id}" ${shoppingEvent===e.id?'selected':''}>${esc(e.name)}</option>`).join('');let ev=d.events.find(e=>e.id===shoppingEvent),needs=ev?quantities(ev.lines):{},rows=ev?Object.entries(needs).map(([x,required])=>{let i=d.items.find(i=>i.id===x),have=i?.qty||0;return {name:itemName(x),have,required,buy:Math.max(0,required-have),unit:i?.unit||'pack'}}):d.items.filter(i=>i.qty<=i.min).map(i=>({name:i.name,have:i.qty,required:i.restock??i.min,buy:Math.max(0,(i.restock??i.min)-i.qty),unit:i.unit||'pack'}));$('shopping').innerHTML=`<h2>Shopping Lists</h2><div class="card"><label>View list</label><select onchange="shoppingEvent=this.value;renderShopping()"><option value="">General restock list</option>${options}</select><p class="muted small">${ev?'Shows stock on hand and supplies needed for this event. This does not deduct stock.':'Low-stock items with suggested quantities based on each item’s separate restock target.'}</p></div><div class="card">${rows.length?rows.map(r=>`<div class="item"><div class="row"><strong>${esc(r.name)}</strong>${r.buy>0?`<span class="pill">Buy ${r.buy}</span>`:'<span class="pill">In stock</span>'}</div><div class="small muted">In stock: ${r.have} ${esc(r.unit)} · ${ev?'Event needs':'Target'}: ${r.required} ${esc(r.unit)}</div></div>`).join(''):'<p class="muted">Nothing needed on this list.</p>'}</div><button onclick="copyShop()">Copy this list</button>`}function copyShop(){let ev=d.events.find(e=>e.id===shoppingEvent),q=ev?quantities(ev.lines):null,rows=ev?Object.entries(q).map(([x,n])=>({name:itemName(x),have:d.items.find(i=>i.id===x)?.qty||0,buy:Math.max(0,n-(d.items.find(i=>i.id===x)?.qty||0))})):d.items.filter(i=>i.qty<=i.min).map(i=>({name:i.name,have:i.qty,buy:Math.max(0,(i.restock??i.min)-i.qty)}));let s=(ev?ev.name:'General restock')+'\n'+rows.map(r=>`${r.name} — have ${r.have}, buy ${r.buy}`).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>alert('Copied')).catch(()=>prompt('Copy list:',s));else prompt('Copy list:',s)}
function renderSettings(){$('settings').innerHTML=`<h2>Customize</h2><div class="card"><h3>My logo</h3>${d.logo?`<img src="${d.logo}" alt="Uploaded logo" style="width:85px;height:85px;object-fit:contain">`:''}<label>Upload logo (small JPG or PNG)</label><input type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadLogo(this)"><p class="muted small">Logo appears in the app header. Large files may exceed phone storage.</p></div><div class="card"><div class="row"><h3>Stock categories</h3><button onclick="editCategory()">+ Category</button></div>${d.categories.map(c=>`<div class="item row category-sort-row" data-category-id="${esc(c.id)}"><button type="button" class="category-drag-handle alt" aria-label="Drag to rearrange ${esc(c.name)}" title="Press and drag to rearrange">☰</button><strong style="flex:1">${esc(c.emoji)} ${esc(c.name)}</strong><button class="alt" onclick="editCategory('${c.id}')">Edit</button></div>`).join('')}</div><div class="card"><h3>Backups</h3><p class="muted small">Export regularly to iCloud Drive. Your information is saved locally on this phone, not synchronized to GitHub.</p><div class="actions"><button onclick="backup()">Download backup</button><button class="alt" onclick="$('restore').click()">Import backup</button></div><input id="restore" hidden type="file" accept="application/json" onchange="restore(this)"></div>`}function editCategory(x=''){let c=d.categories.find(c=>c.id===x)||{name:'',emoji:'📦'};modal(x?'Edit category':'Add category',`<form onsubmit="saveCategory(event,'${x}')"><label>Category name</label><input name="name" required value="${esc(c.name)}"><label>Emoji</label><input name="emoji" value="${esc(c.emoji)}" required><div class="actions"><button>Save category</button>${x?`<button type="button" class="danger" onclick="deleteCategory('${x}')">Delete</button>`:''}</div></form>`)}function saveCategory(e,x){e.preventDefault();let f=e.target,c={id:x||id(),name:f.elements.name.value.trim(),emoji:f.elements.emoji.value.t const fmt=n=>Number.isInteger(n)?String(n):Number(n.toFixed(2)).toString();
const shapeName=x=>d.shapes.find(s=>s.id===x)?.name||'Default recipe yield';
const effectiveYield=(r,l)=>Number(d.shapes.find(s=>s.id===l.shape)?.yield)||Number(r.yield)||1;
const freeKinds={dough:'Cake Dough',finished:'Finished Cake Pops'};
const freeUnit={oz:'oz',lb:'lb',g:'g',batch:'batches',pops:'pops'};
const frozenAvailable=(f,excludePlan='')=>Math.max(0,Number(f.qty)||0);
function reservedCount(fid,excludeKind='',excludeId=''){let n=0;for(let k of ['orders','events'])for(let p of d[k])if(p.status==='Planned'&&!(k===excludeKind&&p.id===excludeId))for(let a of p.allocations||[])if(a.freezer===fid)n+=Number(a.qty)||0;return n}
function renderFreezer(){if(!d.freezerEnabled){$('freezer').innerHTML='<h2>Freezer tracking is turned off</h2><p>Enable it in Settings.</p>';return}let list=d.freezer||[];$('freezer').innerHTML=`<div class="row"><h2>❄️ Freezer</h2><button onclick="editFrozen()">+ Add</button></div><p class="muted">Track cake dough or finished cake pops. Add existing freezer stock without deducting ingredients.</p><div class="grid">${['dough','finished'].map(k=>`<div class="card"><strong>${freeKinds[k]}</strong><div class="muted small">${list.filter(f=>f.kind===k).length} entries</div></div>`).join('')}</div>${list.map(f=>`<div class="card"><div class="row"><strong>${esc(f.flavor||'Unspecified flavor')}</strong><span class="pill">${esc(freeKinds[f.kind]||'Freezer')}</span></div><div style="margin-top:7px"><strong>${fmt(Number(f.qty)||0)} ${esc(f.unit||'pops')}</strong> ${f.kind==='finished'?`· ${esc(shapeName(f.shape))}`:''}</div><div class="small muted">Frozen ${esc(f.date||'date not entered')}${f.useBy?' · Use by '+esc(f.useBy):''}${f.kind==='dough'&&f.estimated?` · Estimated ${esc(f.estimated)} pops`:''}</div>${f.kind==='finished'?`<div class="small muted">Reserved: ${fmt(reservedCount(f.id))} · Unreserved: ${fmt(Math.max(0,f.qty-reservedCount(f.id)))}</div>`:''}${f.notes?`<div class="small">${esc(f.notes)}</div>`:''}<div class="actions"><button class="alt" onclick="editFrozen('${f.id}')">Edit</button><button class="alt" onclick="takeFrozen('${f.id}')">Use / Remove</button><button class="danger" onclick="deleteFrozen('${f.id}')">Delete</button></div></div>`).join('')||'<div class="card muted">Nothing in your freezer yet.</div>'}`}
function editFrozen(x=''){let f=d.freezer.find(f=>f.id===x)||{kind:'finished',flavor:'',qty:0,unit:'pops',date:new Date().toISOString().slice(0,10),useBy:'',estimated:'',notes:'',shape:''};modal(x?'Edit freezer entry':'Add freezer inventory',`<form onsubmit="saveFrozen(event,'${x}')"><label>Type</label><select name="kind" onchange="this.form.querySelector('#freeUnits').innerHTML=this.value==='finished'?'<option value=\'pops\'>pops</option>':'<option value=\'oz\'>oz</option><option value=\'lb\'>lb</option><option value=\'g\'>g</option><option value=\'batch\'>batches</option>'"><option value="finished" ${f.kind==='finished'?'selected':''}>Finished Cake Pops</option><option value="dough" ${f.kind==='dough'?'selected':''}>Cake Dough</option></select><label>Flavor</label><input name="flavor" list="freeFlavors" required value="${esc(f.flavor)}"><datalist id="freeFlavors">${d.recipes.map(r=>`<option value="${esc(r.name)}">`).join('')}</datalist><div class="formgrid"><div><label>Quantity</label><input name="qty" type="number" step="any" min="0" required value="${f.qty}"></div><div><label>Unit</label><select id="freeUnits" name="unit">${(f.kind==='finished'?['pops']:['oz','lb','g','batch']).map(u=>`<option value="${u}" ${f.unit===u?'selected':''}>${freeUnit[u]}</option>`).join('')}</select></div><div><label>Date frozen</label><input type="date" name="date" value="${esc(f.date)}"></div><div><label>Use-by date (optional)</label><input type="date" name="useBy" value="${esc(f.useBy)}"></div></div><label>Popper shape (for finished pops)</label><select name="shape"><option value="">Not specified</option>${d.shapes.map(sh=>`<option value="${sh.id}" ${sh.id===f.shape?'selected':''}>${esc(sh.name)}</option>`).join('')}</select><label>Estimated pops from dough (optional)</label><input name="estimated" type="number" min="0" step="1" value="${esc(f.estimated)}"><label>Notes</label><textarea name="notes">${esc(f.notes)}</textarea><p class="notice">Adding existing freezer stock does not deduct supplies. For newly made freezer stock, use the 'Made from stock' option below.</p><label><input type="checkbox" name="made" style="width:auto"> Made from stock now (deduct one recipe batch)</label><label>Recipe for stock deduction</label><select name="recipe"><option value="">Choose recipe</option>${d.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><div class="actions"><button>Save freezer entry</button></div></form>`)}
function saveFrozen(e,x){e.preventDefault();let f=e.target,z={id:x||id(),kind:f.elements.kind.value,flavor:f.elements.flavor.value.trim(),qty:+f.elements.qty.value,unit:f.elements.unit.value,date:f.elements.date.value,useBy:f.elements.useBy.value,shape:f.elements.shape.value,estimated:f.elements.estimated.value,notes:f.elements.notes.value};if(!Number.isFinite(z.qty)||z.qty<0||(z.kind==='finished'&&(!Number.isInteger(z.qty)||z.unit!=='pops'))){alert('Enter a valid quantity. Finished pops must be whole pops.');return}if(x&&z.qty<reservedCount(x)){alert('This quantity is already reserved for orders or events. Remove reservations first.');return}if(f.elements.made.checked){let r=d.recipes.find(r=>r.id===f.elements.recipe.value);if(!r){alert('Choose a recipe to deduct supplies.');return}let q={};for(let part of r.parts||[])q[part.id]=(q[part.id]||0)+part.qty;let missing=stockShort(q);if(missing.length){alert('Not enough supplies: '+missing.map(([i,n])=>itemName(i)+' needs '+n).join(', '));return}if(!confirm('Deduct one full recipe batch from stock and save this freezer entry?'))return;for(let [i,n] of Object.entries(q))d.items.find(a=>a.id===i).qty-=n;d.log.push({type:'Freezer prepared',date:new Date().toISOString(),used:q})}let old=d.freezer.find(f=>f.id===x);if(old)Object.assign(old,z);else d.freezer.push(z);done()}
function takeFrozen(x){let f=d.freezer.find(f=>f.id===x);let n=Number(prompt('How much to remove ('+f.unit+')?','1'));if(!Number.isFinite(n)||n<=0||f.kind==='finished'&&!Number.isInteger(n)||n>f.qty-reservedCount(x)){alert('Enter a valid amount that is not reserved.');return}f.qty=+(f.qty-n).toFixed(4);d.log.push({type:'Freezer removed',date:new Date().toISOString(),freezer:x,qty:n});save();render()}
function deleteFrozen(x){if(reservedCount(x)){alert('This freezer stock is reserved for an order or event. Remove the reservation first.');return}if(!confirm('Delete this freezer entry?'))return;d.freezer=d.freezer.filter(f=>f.id!==x);done()}
function editShape(x=''){let sh=d.shapes.find(s=>s.id===x)||{name:'',yield:20};modal(x?'Edit popper shape':'Add popper shape',`<form onsubmit="saveShape(event,'${x}')"><label>Shape / popper name</label><input name="name" value="${esc(sh.name)}" required><label>Pops made from one cake mix</label><input name="yield" type="number" min="1" step="1" value="${sh.yield}" required><div class="actions"><button>Save shape</button>${x?`<button type="button" class="danger" onclick="deleteShape('${x}')">Delete</button>`:''}</div></form>`)}
function saveShape(e,x){e.preventDefault();let f=e.target,z={id:x||id(),name:f.elements.name.value.trim(),yield:+f.elements.yield.value};if(!Number.isInteger(z.yield)||z.yield<1){alert('Enter a valid yield.');return}let old=d.shapes.find(s=>s.id===x);if(old)Object.assign(old,z);else d.shapes.push(z);done()}

const oldRenderSettings=renderSettings;renderSettings=function(){oldRenderSettings();$('settings').insertAdjacentHTML('beforeend',`<div class="card"><h3>Popper shapes and yields</h3><p class="muted small">Each yield is the number of pops made from one cake mix. Select a shape for each planned flavor.</p><button onclick="editShape()">+ Add shape</button>${d.shapes.map(sh=>`<div class="item row"><span>${esc(sh.name)} — ${sh.yield} pops / cake mix</span><button class="alt" onclick="editShape('${sh.id}')">Edit</button></div>`).join('')}</div><div class="card"><h3>Freezer settings</h3><label><input type="checkbox" style="width:auto" ${d.freezerEnabled?'checked':''} onchange="d.freezerEnabled=this.checked;save();render()"> Show Freezer tab</label><p class="muted small">Hiding the tab does not delete freezer inventory.</p></div>`)};
const oldRender=render;render=function(){oldRender();if(!d.freezerEnabled){document.querySelectorAll('#nav button').forEach(b=>{if(b.textContent.includes('Freezer'))b.style.display='none'})}if(!d.freezerEnabled&&tab==='freezer')go('stock')};

const oldSavePlan=savePlan;savePlan=function(e,kind,x){e.preventDefault();let f=e.target,lines=[...document.querySelectorAll('.planline')].map(el=>({flavor:el.querySelector('.flavor').value,count:+el.querySelector('.count').value,shape:el.querySelector('.shape')?.value||''}));if(lines.some(l=>!l.flavor||!Number.isInteger(l.count)||l.count<=0)){alert('Choose a flavor and valid pop quantities.');return}let allocations=[];for(let el of document.querySelectorAll('.allocation')){let freezer=el.querySelector('.freezer-id').value,qty=+el.querySelector('.freezer-count').value;if(!freezer||!qty)continue;let fr=d.freezer.find(v=>v.id===freezer);if(!fr||fr.kind!=='finished'||!Number.isInteger(qty)||qty<0){alert('Check freezer reservations.');return}allocations.push({freezer,qty})}let totals={};for(let a of allocations)totals[a.freezer]=(totals[a.freezer]||0)+a.qty;for(let [fid,n] of Object.entries(totals)){let fr=d.freezer.find(v=>v.id===fid);if(n>fr.qty-reservedCount(fid,kind,x)){alert('Not enough unreserved frozen pops for '+fr.flavor);return}let planned=lines.filter(l=>d.recipes.find(r=>r.id===l.flavor)?.name.toLowerCase()===fr.flavor.toLowerCase()).reduce((v,l)=>v+l.count,0);if(n>planned){alert('Frozen '+fr.flavor+' exceeds the planned number of pops for that flavor.');return}}for(let flavor of new Set(allocations.map(a=>d.freezer.find(v=>v.id===a.freezer)?.flavor.toLowerCase()))){let reserved=allocations.filter(a=>d.freezer.find(v=>v.id===a.freezer)?.flavor.toLowerCase()===flavor).reduce((n,a)=>n+a.qty,0);let planned=lines.filter(l=>d.recipes.find(r=>r.id===l.flavor)?.name.toLowerCase()===flavor).reduce((n,l)=>n+l.count,0);if(reserved>planned){alert('Too many frozen pops reserved for '+flavor);return}}let p={id:x||id(),name:f.elements.name.value.trim(),date:f.elements.date.value,status:'Planned',lines,allocations,deducted:false};let old=d[kind].find(v=>v.id===x);if(old)Object.assign(old,p);else d[kind].push(p);done()};
const oldEditPlan=editPlan;editPlan=function(kind,x=''){oldEditPlan(kind,x);if(!$('planlines'))return;let p=d[kind].find(v=>v.id===x);$('planlines').insertAdjacentHTML('afterend',`<h3>Reserve finished freezer pops (optional)</h3><p class="muted small">Reserve pops already made. These will reduce the fresh batches needed. Reservations are deducted from the freezer when you start this plan.</p><div id="allocations"></div><button type="button" class="alt" onclick="addAllocation()">+ Reserve frozen pops</button>`);(p?.allocations||[]).forEach(addAllocation)};
function addAllocation(a={}){let el=document.createElement('div');el.className='pair allocation';el.innerHTML=`<label>Frozen finished pops</label><select class="freezer-id">${d.freezer.filter(f=>f.kind==='finished').map(f=>`<option value="${f.id}" ${f.id===a.freezer?'selected':''}>${esc(f.flavor)} (${f.qty} pops, ${esc(shapeName(f.shape))})</option>`).join('')}</select><label>Number to reserve</label><input class="freezer-count" type="number" min="1" step="1" value="${a.qty||1}"><button type="button" class="alt" onclick="this.parentElement.remove()">Remove</button>`;$('allocations').append(el)}
function freshLines(p){let remain=(p.lines||[]).map(l=>({...l}));for(let a of p.allocations||[]){let f=d.freezer.find(v=>v.id===a.freezer);if(!f)continue;let n=Number(a.qty)||0;for(let l of remain){let r=d.recipes.find(r=>r.id===l.flavor);if(r?.name.toLowerCase()!==f.flavor.toLowerCase())continue;let used=Math.min(n,l.count);l.count-=used;n-=used;if(!n)break}}return remain}
quantities=function(lines){let q={};for(let l of lines||[]){let r=d.recipes.find(r=>r.id===l.flavor);if(!r||!l.count)continue;let mult=Math.ceil(Number(l.count)/effectiveYield(r,l));for(let p of r.parts||[])q[p.id]=(q[p.id]||0)+p.qty*mult}return q};
progress=function(kind,x){let p=d[kind].find(v=>v.id===x);if(!p||p.status!=='Planned')return;if(!p.lines?.length){alert('Add planned flavors first.');return}for(let a of p.allocations||[]){let fr=d.freezer.find(f=>f.id===a.freezer);if(!fr||fr.qty<a.qty){alert('Reserved freezer stock is no longer available.');return}}let q=quantities(freshLines(p)),missing=stockShort(q);if(missing.length){alert('Not enough stock to start. Add these supplies first:\n'+missing.map(([i,n])=>`${itemName(i)}: need ${n}, have ${d.items.find(v=>v.id===i)?.qty||0}`).join('\n'));return}if(!confirm('Start this plan? This will deduct fresh ingredients and the reserved finished pops from freezer inventory.'))return;for(let [i,n] of Object.entries(q))d.items.find(v=>v.id===i).qty-=n;for(let a of p.allocations||[])d.freezer.find(f=>f.id===a.freezer).qty-=a.qty;p.status='In progress';p.deducted=true;p.used=q;p.usedFreezer=p.allocations||[];d.log.push({type:'Plan started',kind,id:x,date:new Date().toISOString(),used:q,usedFreezer:p.usedFreezer});save();render()};
const oldRenderPlans=renderPlans;renderPlans=function(kind){oldRenderPlans(kind);for(let p of d[kind]){let card=[...$(kind).querySelectorAll('.card')].find(c=>c.querySelector(`button[onclick="editPlan('${kind}','${p.id}')"]`));if(!card)continue;let fresh=freshLines(p),frozen=(p.allocations||[]).reduce((n,a)=>n+a.qty,0);card.insertAdjacentHTML('beforeend',`<div class="small muted" style="margin-top:8px">${frozen} finished pops reserved from freezer · ${fresh.reduce((n,l)=>n+l.count,0)} pops to make fresh</div>`)} };
const oldRenderShopping=renderShopping;renderShopping=function(){oldRenderShopping();let ev=d.events.find(e=>e.id===shoppingEvent);if(!ev)return;let q=quantities(freshLines(ev));let rows=Object.entries(q).map(([x,required])=>{let i=d.items.find(v=>v.id===x),have=i?.qty||0;return {name:itemName(x),have,required,buy:Math.max(0,required-have),unit:i?.unit||'pack'}});let cards=$('shopping').querySelectorAll('.card');if(cards[1])cards[1].innerHTML=rows.length?rows.map(r=>`<div class="item"><div class="row"><strong>${esc(r.name)}</strong><span class="pill">${r.buy?'Buy '+r.buy:'In stock'}</span></div><div class="small muted">In stock: ${r.have} ${esc(r.unit)} · Fresh batches need: ${r.required} ${esc(r.unit)}</div></div>`).join(''):'<p class="muted">No fresh ingredients needed.</p>'};
const oldCopyShop=copyShop;copyShop=function(){let ev=d.events.find(e=>e.id===shoppingEvent);if(!ev)return oldCopyShop();let q=quantities(freshLines(ev)),rows=Object.entries(q).map(([x,n])=>({name:itemName(x),have:d.items.find(i=>i.id===x)?.qty||0,buy:Math.max(0,n-(d.items.find(i=>i.id===x)?.qty||0))})),s=ev.name+'\n'+rows.map(r=>`${r.name} — have ${r.have}, buy ${r.buy}`).join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(s).then(()=>alert('Copied')).catch(()=>prompt('Copy list:',s));else prompt('Copy list:',s)};


// Shapes are reusable tools, not consumable stock. Keep the collection inside Stock.
const isShapeCategory=c=>/^(shapes|popper shapes)$/i.test((c?.name||'').trim());
const shapeCategories=()=>d.categories.filter(isShapeCategory);
const isShapeStockItem=i=>shapeCategories().some(c=>c.id===i.type||c.name===i.type);
// Preserve legacy shape supply entries and offer explicit migration, rather than deleting data.
function importLegacyShapes(){let legacy=d.items.filter(isShapeStockItem);if(!legacy.length)return; if(!confirm('Move '+legacy.length+' existing shape supply entries into your reusable Shapes collection? Their old quantities will no longer be tracked. Make a backup first.'))return;for(let i of legacy){if(!d.shapes.some(sh=>sh.name.toLowerCase()===i.name.toLowerCase()))d.shapes.push({id:id(),name:i.name,yield:0});}d.items=d.items.filter(i=>!isShapeStockItem(i));save();render()}
const baseRenderStock=renderStock;

  if(selected&&shapeCategories().some(c=>c.id===selected)){

// Prevent legacy shape entries from creating shopping-list/restock noise.

// Pointer-based category sorting works with touch, mouse, and stylus.
let categoryDrag=null;
document.addEventListener('pointerdown',function(e){
 const handle=e.target.closest('.category-drag-handle');if(!handle||e.button!==0)return;
 const row=handle.closest('.category-sort-row');if(!row)return;
 categoryDrag={pointerId:e.pointerId,source:row,target:row,handle};
 handle.setPointerCapture(e.pointerId);row.classList.add('dragging');e.preventDefault();
});
document.addEventListener('pointermove',function(e){
 const drag=categoryDrag;if(!drag||e.pointerId!==drag.pointerId)return;
 const el=document.elementFromPoint(e.clientX,e.clientY);
 const row=el?.closest('.category-sort-row');
 document.querySelectorAll('.category-sort-row.drag-target').forEach(r=>r.classList.remove('drag-target'));
 if(row){drag.target=row;if(row!==drag.source)row.classList.add('drag-target')}
 // Scroll while dragging near the top or bottom of the viewport.
 if(e.clientY<70)window.scrollBy(0,-14);else if(e.clientY>innerHeight-70)window.scrollBy(0,14);
 e.preventDefault();
});
function endCategoryDrag(e){
 const drag=categoryDrag;if(!drag||e.pointerId!==drag.pointerId)return;
 categoryDrag=null;
 const sourceId=drag.source.dataset.categoryId,targetId=drag.target.dataset.categoryId;
 document.querySelectorAll('.category-sort-row').forEach(r=>r.classList.remove('dragging','drag-target'));
 if(e.type==='pointercancel'||sourceId===targetId)return;
 const from=d.categories.findIndex(c=>c.id===sourceId),to=d.categories.findIndex(c=>c.id===targetId);
 if(from<0||to<0)return;
 d.categories.splice(to,0,d.categories.splice(from,1)[0]);save();render();
}
document.addEventListener('pointerup',endCategoryDrag);
document.addEventListener('pointercancel',endCategoryDrag);

save();render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));</script></body></html>
