<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cake Pop Inventory</title><meta name="theme-color" content="#5b735d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cake Pop Inventory"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><style>*{box-sizing:border-box}body{margin:0;background:#f7f6f1;color:#2f3a30;font:15px system-ui,-apple-system,sans-serif}header{padding:21px 18px 12px;background:#e4eadd}h1{margin:0;font-size:24px}h2{font-size:20px;margin:5px 0 14px}.hint{color:#68746a;font-size:13px}.tabs{display:flex;position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid #dce3da}.tabs button{flex:1;border-radius:0;background:white;color:#526554;font-size:12px;padding:14px 2px;border-bottom:3px solid transparent}.tabs button.active{border-color:#5b735d;font-weight:800}main{padding:16px;max-width:760px;margin:auto;padding-bottom:90px}button{background:#5b735d;color:white;border:0;border-radius:11px;padding:12px 15px;font-weight:650;cursor:pointer}button.secondary{background:#e6eee4;color:#3b5740}button.danger{background:#a94444}.box{background:white;border:1px solid #e1e6df;border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grow{flex:1;min-width:0}.stack{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}.stack button{font-size:13px;padding:9px 12px}.item{padding:13px 0;border-bottom:1px solid #eee}.item:last-child{border:0}.tag{display:inline-block;font-size:11px;background:#ffeed3;border-radius:12px;padding:3px 8px;color:#875c1c}label{display:block;font-weight:650;font-size:13px;margin:13px 0 5px}input,select,textarea{width:100%;border:1px solid #cdd6cb;border-radius:10px;padding:12px;font:inherit;background:white}textarea{min-height:70px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}dialog{border:0;border-radius:20px;width:min(94vw,500px);max-height:85vh;overflow:auto;padding:20px;box-shadow:0 20px 100px #0005}dialog::backdrop{background:#26352788}.notice{padding:12px;border-radius:12px;background:#edf2e8;font-size:13px}.empty{text-align:center;color:#798779;padding:35px 0}.mini{font-size:12px;color:#69746a}section{display:none}section.visible{display:block}</style></head><body><header><h1>🍰 Cake Pop Inventory</h1><div class="hint">Simple stock tracking for your cake pop kitchen</div></header><nav class="tabs" id="tabs"></nav><main><section id="stock"></section><section id="batch"></section><section id="shopping"></section><section id="orders"></section><p class="mini">Your records stay on this device. Export backups regularly.</p></main><dialog id="dialog"><div class="row"><h2 id="dialogTitle"></h2><button class="secondary" onclick="document.getElementById('dialog').close()">✕</button></div><div id="dialogBody"></div></dialog><script>
const KEY='cakepop_simple_v1';const types=['Cake mixes','Inclusions','Emulsions','Sprinkles','Almond bark','Popper shapes','Popsicle sticks','Wraps','Stickers','Boxes','Decorations','Other'];const starter=[['Vanilla cake mix','Cake mixes','box'],['Chocolate cake mix','Cake mixes','box'],['Cookie crumbs','Inclusions','bag'],['Vanilla emulsion','Emulsions','bottle'],['Rainbow sprinkles','Sprinkles','jar'],['White almond bark','Almond bark','package'],['Chocolate almond bark','Almond bark','package'],['Heart popper','Popper shapes','mold'],['Cake pop sticks','Popsicle sticks','pack'],['Clear wraps','Wraps','pack'],['Logo stickers','Stickers','roll'],['Treat boxes','Boxes','box']];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.items))data={items:starter.map((r,i)=>({id:'a'+i,name:r[0],type:r[1],unit:r[2],qty:0,min:1})),recipes:[],orders:[],log:[]};function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Unable to save. Export a backup and check storage.')}}let current='stock';const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),name=id=>data.items.find(i=>i.id===id)?.name||'Deleted item',uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),active=id=>{current=id;render()},low=i=>i.qty<=i.min;function render(){$('tabs').innerHTML=[['stock','📦 Stock'],['batch','🧁 Batches'],['shopping','🛒 Shopping'],['orders','📋 Orders']].map(([id,label])=>`<button class="${id===current?'active':''}" onclick="active('${id}')">${label}</button>`).join('');document.querySelectorAll('section').forEach(s=>s.classList.toggle('visible',s.id===current));stockView();batchView();shopView();orderView()};function open(title,body){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;$('dialog').showModal()};function close(){$('dialog').close();persist();render()};function stockView(){$('stock').innerHTML=`<div class="row"><h2>My supplies (${data.items.length})</h2><button onclick="editItem()">+ Add</button></div><div class="notice">Track full packages, bags, boxes, bottles and rolls. Change counts with + and −.</div><div class="box">${data.items.map(i=>`<div class="item"><div class="row"><div class="grow"><strong>${escape(i.name)}</strong><div class="mini">${escape(i.type)} · ${escape(i.unit)}${low(i)?' · <span class="tag">Restock</span>':''}</div></div><strong>${i.qty}</strong></div><div class="stack"><button class="secondary" onclick="change('${i.id}',-1)">− Use 1</button><button onclick="change('${i.id}',1)">+ Add 1</button><button class="secondary" onclick="editItem('${i.id}')">Edit</button></div></div>`).join('')||'<div class="empty">Add your first supply.</div>'}</div><div class="stack"><button class="secondary" onclick="backup()">⬇ Export backup</button><button class="secondary" onclick="document.getElementById('restore').click()">↥ Import backup</button></div><input id="restore" type="file" accept="application/json" hidden onchange="restore(this)">`};function editItem(id){let i=data.items.find(x=>x.id===id)||{name:'',type:'Cake mixes',unit:'box',qty:0,min:1};open(id?'Edit supply':'Add supply',`<form onsubmit="saveItem(event,'${id||''}')"><label>Supply name</label><input name="name" required value="${escape(i.name)}"><label>Category</label><select name="type">${types.map(t=>`<option ${i.type===t?'selected':''}>${t}</option>`).join('')}</select><div class="two"><div><label>Counted as</label><input name="unit" required value="${escape(i.unit)}" placeholder="box / pack"></div><div><label>How many on hand?</label><input name="qty" type="number" min="0" step="1" required value="${i.qty}"></div></div><label>Restock when count is at or below</label><input name="min" type="number" min="0" step="1" required value="${i.min}"><div class="stack"><button>Save</button>${id?`<button type="button" class="danger" onclick="removeItem('${id}')">Delete</button>`:''}</div></form>`)};function saveItem(e,id){e.preventDefault();let f=new FormData(e.target),i={id:id||uid(),name:f.get('name').trim(),type:f.get('type'),unit:f.get('unit').trim(),qty:Number(f.get('qty')),min:Number(f.get('min'))};let x=data.items.find(x=>x.id===id);if(x)Object.assign(x,i);else data.items.push(i);close()};function removeItem(id){if(!confirm('Delete this supply?'))return;data.items=data.items.filter(x=>x.id!==id);close()};function change(id,delta){let x=data.items.find(i=>i.id===id);if(x.qty+delta<0){alert('Not enough in stock.');return}x.qty+=delta;data.log.push({date:new Date().toISOString(),item:id,change:delta});persist();render()};function batchView(){$('batch').innerHTML=`<div class="row"><h2>Make a batch</h2><button onclick="recipeEdit()">+ Recipe</button></div><div class="notice">Set how many full packages a recipe uses. Recording a batch subtracts the selected supply counts. Fractional packages are not deducted in simple mode.</div>${data.recipes.map(r=>`<div class="box"><div class="row"><strong>${escape(r.name)}</strong><button class="secondary" onclick="recipeEdit('${r.id}')">Edit</button></div><div class="mini">Makes ${r.yield} pops · ${r.parts.map(p=>`${escape(name(p.id))} × ${p.qty}`).join(', ')}</div><div class="stack"><button onclick="runBatch('${r.id}')">✓ Record batch</button></div></div>`).join('')||'<div class="box empty">Add your first batch recipe.</div>'}<h2>Recent production</h2><div class="box">${data.log.filter(l=>l.recipe).slice(-10).reverse().map(l=>`<div class="item">${escape(l.recipe)} · ${l.yield} pops<div class="mini">${new Date(l.date).toLocaleString()}</div></div>`).join('')||'<p class="mini">No batches recorded yet.</p>'}</div>`};function recipeEdit(id){let r=data.recipes.find(x=>x.id===id)||{name:'',yield:20,parts:[]};open(id?'Edit recipe':'New recipe',`<form onsubmit="saveRecipe(event,'${id||''}')"><label>Recipe name / flavor</label><input name="name" required value="${escape(r.name)}"><label>How many pops in this batch?</label><input name="yield" type="number" min="1" step="1" required value="${r.yield}"><h3>Full packages used per batch</h3><div id="parts"></div><button type="button" class="secondary" onclick="addPart()">+ Supply</button><div class="stack"><button>Save recipe</button>${id?`<button type="button" class="danger" onclick="deleteRecipe('${id}')">Delete</button>`:''}</div></form>`);r.parts.forEach(p=>addPart(p));if(!r.parts.length)addPart()};function addPart(p={}){let d=document.createElement('div');d.className='two part';d.innerHTML=`<div><label>Supply</label><select class="pid">${data.items.map(i=>`<option value="${i.id}" ${i.id===p.id?'selected':''}>${escape(i.name)}</option>`).join('')}</select></div><div><label>Full ${escape('packages')} used</label><input class="count" type="number" min="1" step="1" required value="${p.qty||1}"></div><button type="button" class="secondary" onclick="this.parentNode.remove()">Remove</button>`;$('parts').appendChild(d)};function saveRecipe(e,id){e.preventDefault();let f=e.target,r={id:id||uid(),name:f.elements.name.value.trim(),yield:Number(f.elements.yield.value),parts:[...f.querySelectorAll('.part')].map(d=>({id:d.querySelector('select').value,qty:Number(d.querySelector('input').value)}))};if(r.parts.some(p=>!p.id||!Number.isInteger(p.qty)||p.qty<=0)){alert('Choose valid full-package amounts.');return}let old=data.recipes.find(x=>x.id===id);if(old)Object.assign(old,r);else data.recipes.push(r);close()};function deleteRecipe(id){if(!confirm('Delete recipe?'))return;data.recipes=data.recipes.filter(x=>x.id!==id);close()};function runBatch(id){let r=data.recipes.find(x=>x.id===id),total={};for(let p of r.parts)total[p.id]=(total[p.id]||0)+p.qty;let missing=Object.entries(total).filter(([id,q])=>!data.items.find(i=>i.id===id)||data.items.find(i=>i.id===id).qty<q);if(missing.length){alert('Not enough stock: '+missing.map(([id])=>name(id)).join(', '));return}if(!confirm(`Record ${r.yield} ${r.name} pops and deduct ${r.parts.length} supply entries?`))return;for(let [id,q] of Object.entries(total))data.items.find(i=>i.id===id).qty-=q;data.log.push({date:new Date().toISOString(),recipe:r.name,yield:r.yield});persist();render();alert('Batch recorded and stock updated.')};function shopView(){let l=data.items.filter(low);$('shopping').innerHTML=`<h2>Shopping list (${l.length})</h2><div class="notice">Supplies appear here when their count reaches your restock level.</div><div class="box">${l.map(i=>`<div class="item row"><div class="grow"><strong>${escape(i.name)}</strong><div class="mini">${i.qty} ${escape(i.unit)} left · minimum ${i.min}</div></div><button onclick="change('${i.id}',1)">+1</button></div>`).join('')||'<div class="empty">Everything is stocked!</div>'}</div><button class="secondary" onclick="copyList()">Copy shopping list</button>`};function copyList(){let x=data.items.filter(low).map(i=>`${i.name} — ${i.qty} ${i.unit} left`).join('\n')||'Nothing to buy';if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(x).then(()=>alert('Copied')).catch(()=>prompt('Copy this:',x));else prompt('Copy this:',x)};function orderView(){$('orders').innerHTML=`<div class="row"><h2>Custom orders</h2><button onclick="editOrder()">+ Order</button></div><div class="notice">Orders are for planning. Record a batch separately when you produce it so supplies are deducted only once.</div>${data.orders.map(o=>`<div class="box"><div class="row"><strong>${escape(o.customer)}</strong><span class="tag">${escape(o.status)}</span></div><div class="mini">${escape(o.due||'No due date')} · ${o.qty} pops</div><p>${escape(o.notes)}</p><button class="secondary" onclick="editOrder('${o.id}')">Edit order</button></div>`).join('')||'<div class="box empty">No custom orders yet.</div>'}`};function editOrder(id){let o=data.orders.find(x=>x.id===id)||{customer:'',due:'',qty:20,notes:'',status:'Planned'};open(id?'Edit order':'New order',`<form onsubmit="saveOrder(event,'${id||''}')"><label>Customer / event</label><input name="customer" required value="${escape(o.customer)}"><div class="two"><div><label>Due date</label><input type="date" name="due" value="${escape(o.due)}"></div><div><label>Number of pops</label><input type="number" min="1" step="1" name="qty" required value="${o.qty}"></div></div><label>Flavors and details</label><textarea name="notes">${escape(o.notes)}</textarea><label>Status</label><select name="status">${['Planned','In progress','Completed'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><div class="stack"><button>Save order</button>${id?`<button type="button" class="danger" onclick="deleteOrder('${id}')">Delete</button>`:''}</div></form>`)};function saveOrder(e,id){e.preventDefault();let f=new FormData(e.target),o={id:id||uid(),customer:f.get('customer'),due:f.get('due'),qty:Number(f.get('qty')),notes:f.get('notes'),status:f.get('status')},old=data.orders.find(x=>x.id===id);if(old)Object.assign(old,o);else data.orders.push(o);close()};function deleteOrder(id){if(!confirm('Delete this order?'))return;data.orders=data.orders.filter(x=>x.id!==id);close()};function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='cake-pop-inventory-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};async function restore(x){try{let obj=JSON.parse(await x.files[0].text());if(!Array.isArray(obj.items)||!Array.isArray(obj.recipes)||!Array.isArray(obj.orders))throw Error('Not a valid backup');if(confirm('Replace current inventory with imported backup?')){data=obj;persist();render()}}catch(e){alert('Unable to restore: '+e.message)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
